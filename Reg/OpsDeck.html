<script>
/* =========================================================================
   OPSDECK — Ticket & Task Portal
   ---------------------------------------------------------------------
   REBUILT AROUND THE REAL ap2_ticLog CACHE SHAPE.

   The connected cache's .data object is { Ticket: [...], ticLog: [...] } —
   but those two arrays are the OPPOSITE of what their names suggest:

     payload.Ticket  — the real append-only FLOW/EVENT log. One row per
       event: Event_ID, Ticket_ID, Action, Status, From, Performed_By, To,
       Detail. This is what every timeline, status, and "who did what"
       view is built from.

     payload.ticLog  — the per-ticket MASTER/CREATION record. One row per
       ticket (not per event): Event_ID (points at the CREATED event),
       Ticket_ID, Created_By, Subject_Type, Subject_ID, Assigned_To,
       Assignment_Type, Priority, Status, Notes. This is where the FIXED
       facts about a ticket live — most importantly Subject_ID, which is
       the Subject Employee (E2) the earlier version of this file was
       missing entirely. It's really here now, so Flow Finder, the ticket
       list, and the New Ticket form all key off it directly.

   IDENTITY IN THE REAL DATA
   Every actor (Created_By, Performed_By, From, To, Assigned_To) is a
   short staff code like "M001".."M008" — management/operations people
   (E1/E3/E4... in the requirement doc). Every Subject Employee (E2) is a
   short code like "E101".."E105". Departments show up as plain names
   ("Finance","HR","SIM","Bike","Fleet","Payroll") wherever a code isn't
   one of the two patterns above. None of these come with real names —
   there's no separate roster in this cache — so this file builds its
   people/department directory straight out of whatever codes actually
   appear in the log (discoverDirectory below), the same "grows from the
   data, nothing hardcoded" approach the previous version used for emails.
   Because there's no login mapping from a real session to one of these
   M-codes, an "Acting as" bar (top of every view) lets you pick which
   discovered staff code you're operating as, and its role/department —
   this is what makes every scenario (worker/manager/GM, dept queues,
   oversight, Flow Finder scoping) actually reachable and testable.

   EVENT_ID AS DATE/TIME
   Per instruction, Event_ID doubles as both the sort key AND the literal
   timestamp for a flow event — it's treated as epoch milliseconds
   (new Date(Number(Event_ID))) everywhere a time is shown or a gap is
   computed, exactly like the cache's own top-level {ts:...} field is.

   TICKET LIFECYCLE (requirement §1–§11, now action-complete)
   CREATED → (queued to a Department OR delegated straight to a Person,
   chosen at creation time) → ACCEPTED (claims it) → COMMENT / ON_HOLD /
   RESUMED / REMINDER / REMINDER_ALERT (auto) / REMINDER_ATTENDED /
   TRANSFERRED (to another Department or delegated to another Person,
   which always re-queues to NEW pending Accept, matching the real
   TK-5002 sample exactly) → RESOLVED. Every action is one more append-
   only event row — nothing is ever edited or removed, only added.
   ========================================================================= */

// ---------- Time helpers ----------
let demoOffsetMs = 0;
function nowMs(){ return Date.now() + demoOffsetMs; }
function pad(n,l=2){ return String(n).padStart(l,'0'); }
// All ticket/reminder timestamps are shown and entered in UAE time
// (Asia/Dubai), regardless of the device's own timezone. Dubai runs a
// fixed UTC+4 offset with no daylight saving, so a plain numeric offset
// is reliable — no Intl/timezone tables needed. Event_IDs and dueAtMs
// values themselves stay absolute epoch ms (unaffected); only display
// and user-entered wall-clock time go through these.
const UAE_OFFSET_MS = 4*3600000;
function dubaiParts(ms){
  const d = new Date(ms + UAE_OFFSET_MS);
  return {
    year: d.getUTCFullYear(), month: d.getUTCMonth(), day: d.getUTCDate(),
    hour: d.getUTCHours(), minute: d.getUTCMinutes(), second: d.getUTCSeconds(),
    weekdayIdx: d.getUTCDay(),
  };
}
function dubaiToMs(year, month, day, hour, minute, second=0){
  return Date.UTC(year, month, day, hour, minute, second) - UAE_OFFSET_MS;
}
const WEEKDAY_ABBR = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmtTs(ms){
  const d = dubaiParts(ms);
  return `${d.year}-${pad(d.month+1)}-${pad(d.day)} ${pad(d.hour)}:${pad(d.minute)}:${pad(d.second)}`;
}
function fmtDur(ms){
  ms = Math.abs(ms);
  if(ms<1000) return ms+'ms';
  const s=Math.floor(ms/1000);
  if(s<60) return s+'s';
  const m=Math.floor(s/60);
  if(m<60) return m+'m '+(s%60)+'s';
  const h=Math.floor(m/60);
  if(h<48) return h+'h '+(m%60)+'m';
  const dd=Math.floor(h/24);
  return dd+'d '+(h%24)+'h';
}
function statusClass(s){ return 'st-'+String(s||'').replace(/\s+/g,''); }
// Display-only relabel: the underlying status value stored on every event/
// ticket row stays exactly 'NEW' (so every comparison, filter, and the real
// ap2_ticLog vocabulary are untouched) — this just changes what a brand-new,
// not-yet-accepted ticket is CALLED wherever its status is shown to a user.
// Once someone Accepts it the stored status becomes 'IN PROGRESS' already,
// which already displays as-is.
function statusDisplayLabel(s){ return s==='NEW' ? 'Open' : s; }
const MONTH_ABBR = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtReminderDetail(ms){
  const d = dubaiParts(ms);
  return `Reminder: ${pad(d.day)}-${MONTH_ABBR[d.month]}-${d.year} ${pad(d.hour)}:${pad(d.minute)}`;
}
function parseReminderDetail(detail){
  const m = String(detail||'').match(/Reminder:\s*(\d{1,2})-([A-Za-z]{3})-(\d{4})\s+(\d{1,2}):(\d{2})/);
  if(!m) return null;
  const monthIdx = MONTH_ABBR.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());
  if(monthIdx<0) return null;
  return dubaiToMs(+m[3], monthIdx, +m[1], +m[4], +m[5], 0);
}

/* ═══════════ Identity codes ═══════════
   Staff (management/ops, E1/E3/E4... in the requirement doc) = "M###".
   Subject Employee (E2) = "E###". Anything else that shows up in a
   From/To/Assigned_To slot is treated as a department name. */
function isEmailToken(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim()); }
function isStaffCode(v){ v=String(v||'').trim(); return /^M\d+$/i.test(v) || isEmailToken(v); }
function isSubjectCode(v){ return /^(emp|E)\d+$/i.test(String(v||'').trim()); }
function isPersonCode(v){ return isStaffCode(v) || isSubjectCode(v); }
function isDeptToken(v){ v=String(v||'').trim(); return !!v && !isPersonCode(v); }

/* ═══════════ Users directory (payload.Users — real names/roles/status) ═══════════
   Role strings come as either a bare tier ("GM","Manager","Visitor") or
   "Title | Department" ("Officer | Deliveroo"). Split them once here so
   every dropdown can show a real name and, where relevant, a department. */
let USERS = {};       // email(lowercase) -> {email, name, role, roleTitle, deptName, roleTier, status}
let USERS_LIST = [];
let USERS_READY = false; // flips true once a real (non-empty) Users cache payload has landed
// Any of these titles (bare, or the part before "|") get org-wide,
// unfiltered oversight — same tier as GM — regardless of whether a
// department was ever attached to the role string.
const EXEC_TITLE_PATTERNS = [
  /^gm$/, /^general\s*manager$/, /^ceo$/, /^chief\s+executive(\s+officer)?$/,
  /^cfo$/, /^chief\s+financial(\s+officer)?$/, /^coo$/, /^chief\s+operating(\s+officer)?$/,
  /^cto$/, /^chief\s+technology(\s+officer)?$/, /^chief\b/, /^president$/,
  /^vice\s*president$/, /^vp$/, /^director$/, /^head(\s+of\b.*)?$/,
];
function roleTierOf(title){
  const t = String(title||'').trim().toLowerCase();
  if(EXEC_TITLE_PATTERNS.some(re=>re.test(t))) return 'gm';
  if(t==='manager') return 'manager';
  return 'worker';
}
// ap_session's own "role" field uses the exact same "Title | Department"
// format as the Users cache's role column (confirmed against real session
// payloads: "Manager" with no department, "Officer | Deliveroo" with one) —
// so it's split the same way parseUserRow splits it. This lets the signed-in
// user's own designation/department/tier be known the instant the session
// loads, without waiting on the Users cache to arrive.
function parseSessionRole(rawRole){
  const parts = String(rawRole||'').trim().split('|').map(s=>s.trim()).filter(Boolean);
  const roleTitle = parts[0] || '';
  const deptName = parts[1] || '';
  return {roleTitle, deptName, roleTier: roleTierOf(roleTitle)};
}
// {email, name, roleTitle, deptName, roleTier} for the signed-in user, read
// straight off ap_session — set once at boot in bootstrapIdentity(). null
// until a real session with an email has been read.
let SESSION_IDENTITY = null;
function parseUserRow(r){
  if(!r) return null;
  const email = String(_pick(r,['email','Email'])||'').trim();
  if(!email) return null;
  const name = String(_pick(r,['name','Name'])||'').trim() || email;
  const rawRole = String(_pick(r,['role','Role'])||'').trim();
  const parts = rawRole.split('|').map(s=>s.trim()).filter(Boolean);
  const roleTitle = parts[0] || rawRole;
  const deptName = parts[1] || '';
  return {
    email, name, role: rawRole, roleTitle, deptName,
    roleTier: roleTierOf(roleTitle),
    status: String(_pick(r,['status','Status'])||'').trim().toLowerCase() || 'active',
  };
}
function parseUsers(payload){
  USERS = {}; USERS_LIST = [];
  const rows = Array.isArray(payload && payload.Users) ? payload.Users : [];
  rows.map(parseUserRow).filter(Boolean).forEach(u=>{ USERS[u.email.toLowerCase()] = u; USERS_LIST.push(u); });
  if(rows.length) USERS_READY = true; // real cache data has arrived, even if every row got filtered
}
function userFor(v){ return USERS[String(v||'').trim().toLowerCase()] || null; }

/* ═══════════ Employee directory (ap2_employee cache) ═══════════
   Real HR roster for the New Ticket "Subject Employee" picker — separate
   from SUBJECTS (the E101-style codes discovered in the ticket log).
   ap2_employee rows are plain arrays: [id, name, ...]. A lot of the raw
   cache is throwaway test rows (single lowercase words like "asif"/"sdc",
   or an all-lowercase name), so only rows that look like a real, properly
   cased name are kept; everything else — and duplicate ids — is dropped. */
let EMPLOYEES = [];           // [{id, name}], deduped, dummy rows removed
let EMPLOYEE_CACHE_OK = false; // true once ap2_employee has loaded with data
const REAL_NAME_RE = /^[A-Z][a-zA-Z'.-]*(\s[A-Z][a-zA-Z'.-]*)*$/;
function parseEmployeeRow(r){
  if(!Array.isArray(r)) return null;
  const id = String(r[0]==null?'':r[0]).trim();
  const name = String(r[1]==null?'':r[1]).trim();
  if(!id || !name || !REAL_NAME_RE.test(name)) return null; // drop dummy/test rows
  return {id, name};
}
function parseEmployees(rows){
  const seen = new Set(), out = [];
  (Array.isArray(rows)?rows:[]).forEach(r=>{
    const e = parseEmployeeRow(r);
    if(!e || seen.has(e.id)) return;
    seen.add(e.id);
    out.push(e);
  });
  return out.sort((a,b)=>a.name.localeCompare(b.name));
}
function employeeLabel(e){ return `${e.id} — ${e.name}`; }
// Applies a fresh ap2_employee row-set (from IndexedDB OR a live push from
// the parent shell) and updates the UI in place — this is the single path
// both loadEmployees() and the cache-push listeners below funnel through,
// so the Subject Employee dropdown never goes stale.
function applyEmployeeRows(rows){
  if(Array.isArray(rows) && rows.length){
    EMPLOYEES = parseEmployees(rows);
    EMPLOYEE_CACHE_OK = true;
  } else {
    EMPLOYEE_CACHE_OK = false;
  }
  safeRender();
  refreshOpenDrawer();
}
async function loadEmployees(){
  try{
    const rows = await _readCache(_AP2_CACHE_KEY_EMP);
    applyEmployeeRows(rows);
  }catch(e){
    EMPLOYEE_CACHE_OK = false;
    safeRender();
    refreshOpenDrawer();
  }
}

/* ═══════════ Professional multi-select widget ═══════════
   Reusable checkbox/radio dropdown with chips + search, used wherever a
   picker needs to switch between "Department" and "Person" option sets
   (Flow Finder's Handler / Department filters — single-select only — and
   the New Ticket "Route to" field, which still allows multiple). */
const MSEL_UI = {}; // id -> {open:bool, q:string}
function mselState(id){ if(!MSEL_UI[id]) MSEL_UI[id] = {open:false, q:''}; return MSEL_UI[id]; }
function mselCloseAllExcept(id){
  Object.keys(MSEL_UI).forEach(k=>{ if(k!==id) MSEL_UI[k].open = false; });
}
function escAttr(s){ return String(s==null?'':s).replace(/"/g,'&quot;'); }
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* options: [{value, label, sub?}]. selected: array of currently chosen values.
   opts.placeholder / opts.allowAdd (shows a "+ add custom value" row, used
   for "+ New department name…"). */
function renderMultiSelect(id, options, selected, opts){
  opts = opts || {};
  const st = mselState(id);
  const selSet = new Set((selected||[]).map(String));
  const selectedOptions = options.filter(o=>selSet.has(String(o.value)));
  const q = st.q.trim().toLowerCase();
  const filtered = q ? options.filter(o=> o.label.toLowerCase().includes(q) || (o.sub||'').toLowerCase().includes(q)) : options;
  const shown = opts.maxOptions ? filtered.slice(0, opts.maxOptions) : filtered;
  const truncated = opts.maxOptions && filtered.length > shown.length;
  return `
  <div class="msel${st.open?' open':''}" id="${id}">
    <div class="msel-control" data-msel-toggle="${id}">
      ${selectedOptions.length
        ? `<div class="msel-chips">${selectedOptions.map(o=>`<span class="msel-chip"><span class="msel-chip-label">${escHtml(o.label)}</span><button type="button" class="msel-chip-x" data-msel-remove="${id}" data-value="${escAttr(o.value)}" aria-label="Remove">✕</button></span>`).join('')}</div>`
        : `<span class="msel-placeholder">${escHtml(opts.placeholder||'Select…')}</span>`}
      <span class="msel-caret">${st.open?'▲':'▼'}</span>
    </div>
    ${st.open ? `
    <div class="msel-panel" data-msel-panel="${id}">
      <input type="text" class="msel-search" id="${id}-search" placeholder="${escAttr(opts.searchPlaceholder||'Search…')}" value="${escAttr(st.q)}">
      <div class="msel-options">
        ${shown.length ? shown.map(o=>`
          <label class="msel-option">
            <input type="${opts.single?'radio':'checkbox'}" ${opts.single?`name="${escAttr(id)}-radio"`:''} data-msel-check="${id}" value="${escAttr(o.value)}" ${selSet.has(String(o.value))?'checked':''}>
            <span>${escHtml(o.label)}</span>
            ${o.sub?`<span class="msel-opt-sub">${escHtml(o.sub)}</span>`:''}
          </label>`).join('') : `<div class="msel-empty">No matches</div>`}
        ${truncated ? `<div class="msel-empty">Showing top ${shown.length} of ${filtered.length} — keep typing to narrow it down</div>` : ''}
      </div>
      <div class="msel-footer">
        <span class="msel-count">${opts.single ? (selectedOptions.length?'1 selected':'none selected') : `${selectedOptions.length} selected`}</span>
        ${selectedOptions.length && !opts.single ? `<button type="button" data-msel-clear="${id}">Clear all</button>` : ''}
      </div>
      ${opts.allowAdd ? `
      <div class="msel-addrow">
        <input type="text" id="${id}-addinput" placeholder="${escAttr(opts.addPlaceholder||'+ Add custom value…')}" value="${escAttr(st.addVal||'')}">
        <button type="button" data-msel-addbtn="${id}">Add</button>
      </div>` : ''}
    </div>` : ''}
  </div>`;
}

/* Wires up a rendered multi-select. getSelected/setSelected read & write the
   backing array; onRefresh re-renders just enough of the DOM to reflect the
   new state (usually the caller's own refresh/render function). */
function wireMultiSelect(id, getSelected, setSelected, onRefresh, wopts){
  wopts = wopts || {};
  const root = document.getElementById(id);
  if(!root) return;
  const toggle = root.querySelector(`[data-msel-toggle="${id}"]`);
  if(toggle) toggle.onclick = (e)=>{
    e.stopPropagation();
    const st = mselState(id);
    const wasOpen = st.open;
    mselCloseAllExcept(id);
    st.open = !wasOpen;
    if(!st.open) st.q = '';
    onRefresh();
    if(st.open){
      document.addEventListener('mousedown', mselOutsideHandler, true);
      setTimeout(()=>{ const inp = document.getElementById(id+'-search'); if(inp){ inp.focus(); } }, 0);
    }
  };
  root.querySelectorAll(`[data-msel-remove="${id}"]`).forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const v = btn.dataset.value;
      setSelected(getSelected().filter(x=>String(x)!==String(v)));
      onRefresh();
    };
  });
  const panel = root.querySelector(`[data-msel-panel="${id}"]`);
  if(panel){
    panel.onmousedown = (e)=> e.stopPropagation();
    // Only the Flow Finder toolbar's multi-selects need this — everywhere
    // else (New Ticket drawer, Respond modal) the plain absolute panel
    // already renders fine, so scope the fixed-position fix to that one
    // clipping container instead of changing every msel on the page.
    if(root.closest('.ff-toolbar')){
      panel.style.width = root.offsetWidth + 'px';
      positionFfPanel(root, panel, 'left');
    }
  }
  root.querySelectorAll(`[data-msel-check="${id}"]`).forEach(cb=>{
    cb.onchange = ()=>{
      if(wopts.single){
        setSelected(cb.checked ? [cb.value] : []);
        mselState(id).open = false;
        mselState(id).q = '';
        onRefresh();
        return;
      }
      let sel = getSelected().map(String);
      if(cb.checked){ if(!sel.includes(cb.value)) sel.push(cb.value); }
      else { sel = sel.filter(x=>x!==cb.value); }
      setSelected(sel);
      onRefresh();
    };
  });
  const search = document.getElementById(id+'-search');
  if(search){
    search.oninput = ()=>{ mselState(id).q = search.value; onRefresh(); };
  }
  const clearBtn = root.querySelector(`[data-msel-clear="${id}"]`);
  if(clearBtn) clearBtn.onclick = (e)=>{ e.stopPropagation(); setSelected([]); onRefresh(); };
  const addBtn = root.querySelector(`[data-msel-addbtn="${id}"]`);
  const addInput = document.getElementById(id+'-addinput');
  if(addInput) addInput.oninput = ()=>{ mselState(id).addVal = addInput.value; };
  if(addBtn) addBtn.onclick = (e)=>{
    e.stopPropagation();
    const val = (addInput ? addInput.value : '').trim();
    if(!val) return;
    if(wopts.single){
      setSelected([val]);
      mselState(id).open = false;
      mselState(id).q = '';
      mselState(id).addVal = '';
      onRefresh();
      return;
    }
    const sel = getSelected().map(String);
    if(!sel.includes(val)) sel.push(val);
    setSelected(sel);
    mselState(id).addVal = '';
    onRefresh();
  };
}
function mselOutsideHandler(e){
  const openId = Object.keys(MSEL_UI).find(k=>MSEL_UI[k].open);
  if(!openId) { document.removeEventListener('mousedown', mselOutsideHandler, true); return; }
  const root = document.getElementById(openId);
  if(root && root.contains(e.target)) return;
  MSEL_UI[openId].open = false;
  MSEL_UI[openId].q = '';
  document.removeEventListener('mousedown', mselOutsideHandler, true);
  if(typeof window.__mselRefresh === 'function') window.__mselRefresh();
}

let STAFF = [];        // [{id, dept, role}]
let SUBJECTS = [];     // [{id}]
let DEPARTMENTS = [];  // [{id, name}]
function staff(id){ return STAFF.find(s=>s.id===id); }
function subjectEmp(id){ return SUBJECTS.find(s=>s.id===id); }
function dept(id){ return DEPARTMENTS.find(d=>d.id===id); }
function deptByName(name){ return DEPARTMENTS.find(d=>d.name.toLowerCase()===String(name||'').toLowerCase()); }
function deptIdFor(name){
  const key = String(name||'').trim();
  if(!key) return null;
  let d = deptByName(key);
  if(!d){ d = {id:'D_'+key.replace(/[^a-z0-9]/gi,'').toUpperCase(), name:key}; DEPARTMENTS.push(d); }
  return d.id;
}

// Role/department are never given for an "M" code in this cache — there's
// no roster, only the flow log — so they're kept in an editable overlay
// (STAFF_META), seeded with a sensible default (manager, unassigned) so
// every view is reachable immediately, and adjustable from the "Acting
// as" bar to deliberately exercise the worker/manager/GM-scoped views.
const STAFF_META_KEY = 'opsdeck_staff_meta_v1';
let STAFF_META = {};
function loadStaffMeta(){
  try{ STAFF_META = JSON.parse(localStorage.getItem(STAFF_META_KEY) || '{}'); }catch(e){ STAFF_META = {}; }
}
function metaFor(id){
  const u = userFor(id);
  if(u){
    // Known Users-cache account — role/department always come live from the
    // cache. Never freeze this in STAFF_META: there's no "Acting as"
    // switcher to justify an override anymore, and a stale localStorage
    // entry from old testing would otherwise permanently mask the real
    // role/department every time this id shows up.
    //
    // A "manager"-tier role with NO department attached (role string was
    // just "Manager", no "| Dept") can't be scoped to a single queue —
    // there's nothing to scope it to. Rather than leaving them stuck with
    // no Department tab and no Org tab, treat them as org-wide oversight
    // (same tier as GM/CEO/CFO/Head/etc.): unfiltered visibility across
    // every department's tickets and every pending item.
    const deptId = u.deptName ? deptIdFor(u.deptName) : null;
    const role = (u.roleTier==='manager' && !deptId) ? 'gm' : u.roleTier;
    return {role, dept: deptId};
  }
  // Users cache hasn't loaded this account yet — if it's the signed-in
  // user themselves, ap_session already carries their own real designation
  // ("Title | Department", same format/rule as above), so use that instead
  // of the STAFF_META guess below. This is only a stand-in for the gap
  // before the cache lands: the branch above takes over the moment it does.
  if(SESSION_IDENTITY && String(id).trim().toLowerCase()===SESSION_IDENTITY.email.toLowerCase()){
    const deptId = SESSION_IDENTITY.deptName ? deptIdFor(SESSION_IDENTITY.deptName) : null;
    const role = (SESSION_IDENTITY.roleTier==='manager' && !deptId) ? 'gm' : SESSION_IDENTITY.roleTier;
    return {role, dept: deptId};
  }
  if(!STAFF_META[id]){
    STAFF_META[id] = {role:'manager', dept:null}; // legacy/unknown M-code with no Users row — old default
  }
  return STAFF_META[id];
}

function registerStaff(id){
  if(!id || staff(id)) return;
  const m = metaFor(id);
  STAFF.push({id, role:m.role, dept:m.dept});
}
function registerSubject(id){
  if(!id || subjectEmp(id)) return;
  SUBJECTS.push({id});
}
function registerDeptToken(name){
  if(!name) return;
  deptIdFor(name);
}

function discoverDirectory(events, masters){
  STAFF = []; SUBJECTS = []; DEPARTMENTS = [];
  const touch = v=>{
    v = String(v||'').trim();
    if(!v) return;
    if(isStaffCode(v)) registerStaff(v);
    else if(isSubjectCode(v)) registerSubject(v);
    else registerDeptToken(v);
  };
  (events||[]).forEach(e=>{ touch(e.from); touch(e.performedBy); touch(e.to); });
  Object.values(masters||{}).forEach(m=>{ touch(m.createdBy); touch(m.assignedToInitial); touch(m.subjectId); });
  // Seed every known active user + their department too, so "Acting as",
  // department filters, and "Delegate to" pickers are populated from the
  // real roster (Users cache) even for people who haven't touched a ticket yet.
  USERS_LIST.forEach(u=>{
    if(u.status && u.status!=='active') return;
    if(u.deptName) deptIdFor(u.deptName);
    registerStaff(u.email);
  });
  // sync live role/dept from the (possibly just-edited) STAFF_META overlay
  STAFF.forEach(s=>{ const m=metaFor(s.id); s.role=m.role; s.dept=m.dept; });
  // The signed-in user must always be present, even if they've never
  // touched a ticket and aren't (yet) an active row in the Users sheet.
  if(ME) registerStaff(ME);
}

// Dropdown-only sourcing: department/person pickers must come straight from
// the Users cache (payload.Users), active rows only — not from every code
// discoverDirectory() happens to see in the ticket log.
function activeUsersList(){ return USERS_LIST.filter(u=>u.status==='active'); }
function activeDeptOptions(){
  const seen = new Set(), out = [];
  activeUsersList().forEach(u=>{
    if(!u.deptName) return;
    const key = u.deptName.toLowerCase();
    if(seen.has(key)) return;
    seen.add(key);
    out.push({name:u.deptName});
  });
  return out.sort((a,b)=>a.name.localeCompare(b.name));
}
function activePersonOptions(){
  return activeUsersList().slice().sort((a,b)=>a.name.localeCompare(b.name));
}

function isManager(id){ const s=staff(id); return !!s && s.role==='manager'; }
function isGM(id){ const s=staff(id); return !!s && s.role==='gm'; }
function deptWorkers(deptId){ return STAFF.filter(s=>s.dept===deptId); }

// nameOf() resolves any id/token this app ever stores in From/To/Assigned
// slots: a staff code, a subject-employee code, or a department name/id —
// falling back to the raw value so nothing ever renders blank.
function nameOf(v){
  if(!v) return '—';
  if(dept(v)) return dept(v).name + ' (Dept)';
  const dn = deptByName(v); if(dn) return dn.name + ' (Dept)';
  const u = userFor(v);
  if(u) return u.name;
  if(SESSION_IDENTITY && SESSION_IDENTITY.name && String(v).trim().toLowerCase()===SESSION_IDENTITY.email.toLowerCase()) return SESSION_IDENTITY.name;
  if(isSubjectCode(v)) return v;
  if(isStaffCode(v)) return v;
  return v;
}
// Real job-title string ("Officer", "Manager", "Head of Ops"...) for
// display — from the Users cache, falling back to the session's own role
// for the signed-in user before that cache has loaded them. Empty string
// (not a tier guess) when neither source has it, so callers can fall back
// to their own gm/manager/worker label.
function designationOf(id){
  const u = userFor(id);
  if(u && u.roleTitle) return u.roleTitle;
  if(SESSION_IDENTITY && SESSION_IDENTITY.roleTitle && String(id).trim().toLowerCase()===SESSION_IDENTITY.email.toLowerCase()) return SESSION_IDENTITY.roleTitle;
  return '';
}
function deptNameOfTarget(v){
  if(dept(v)) return dept(v).name;
  const dn = deptByName(v); if(dn) return dn.name;
  return v;
}

/* ═══════════ CACHE — via shared cacheWatcher.js, with a safe fallback ═══════════ */
const _AP2_CACHE_KEY = 'ap2_ticLog';
const _AP2_CACHE_KEY_EMP = 'ap2_employee';

if(typeof window.AP2CacheWatcher === 'undefined'){
  console.warn('[OpsDeck] cacheWatcher.js did not load — using local fallback');
  window.AP2CacheWatcher = (function(){
    const _IDB_NAME = 'ap2_fleet_cache', _IDB_STORE = 'datasets';
    let _conn = null;
    function _open(){
      if(_conn) return Promise.resolve(_conn);
      return new Promise((res, rej)=>{
        let done = false;
        const req = indexedDB.open(_IDB_NAME);
        const t = setTimeout(()=>{ if(!done){ done=true; rej(new Error('idb-open-timeout')); } }, 2000);
        req.onsuccess = e=>{ if(!done){ done=true; clearTimeout(t); _conn=e.target.result; res(_conn); } };
        req.onerror   = e=>{ if(!done){ done=true; clearTimeout(t); rej(e.target.error); } };
      });
    }
    return {
      init(){},
      subscribe(){ return ()=>{}; },
      notifyNow(){},
      getStatus(){ return {healthy:false, mode:'local-fallback', lastError:'cacheWatcher.js not loaded'}; },
      async readKey(key){
        try{
          const db = await _open();
          if(!db.objectStoreNames.contains(_IDB_STORE)) return null;
          const rec = await new Promise((res, rej)=>{
            const r = db.transaction(_IDB_STORE, 'readonly').objectStore(_IDB_STORE).get(key);
            r.onsuccess = ()=>res(r.result || null);
            r.onerror   = ()=>rej(r.error);
          });
          if(!rec || !rec.data) return null;
          if(Array.isArray(rec.data)) return rec.data.length ? rec.data : null;
          if(typeof rec.data==='object') return rec.data;
          return null;
        }catch(e){
          if(e && e.name==='NotFoundError') return null;
          console.warn('[OpsDeck] fallback read failed:', e.message);
          return null;
        }
      }
    };
  })();
}
async function _readCache(key=_AP2_CACHE_KEY){ return AP2CacheWatcher.readKey(key); }

// Local-only overlay: tickets/events created *in this browser* aren't
// written back into the real cache (this page doesn't know the backend's
// write API) — they're kept in localStorage and replayed on top of
// whatever the real cache contains every time it (re)loads.
const LOCAL_OVERLAY_KEY = 'opsdeck_local_overlay_v2';
let LOCAL_EVENTS = [];   // same shape as a parsed event row, local:true
let LOCAL_MASTERS = {};  // ticketId -> master row, local:true
function saveOverlay(){
  try{ localStorage.setItem(LOCAL_OVERLAY_KEY, JSON.stringify({events:LOCAL_EVENTS, masters:LOCAL_MASTERS})); }catch(e){}
}
function loadOverlay(){
  try{
    const raw = JSON.parse(localStorage.getItem(LOCAL_OVERLAY_KEY)||'{}');
    LOCAL_EVENTS = Array.isArray(raw.events) ? raw.events : [];
    LOCAL_MASTERS = raw.masters && typeof raw.masters==='object' ? raw.masters : {};
  }catch(e){ LOCAL_EVENTS=[]; LOCAL_MASTERS={}; }
}
function applyOverlay(){
  LOCAL_EVENTS.forEach(e=>EVENTS.push(e));
  Object.keys(LOCAL_MASTERS).forEach(tid=>{ TICKET_MASTER[tid] = LOCAL_MASTERS[tid]; });
  EVENTS.sort((a,b)=>a.eventId-b.eventId);
}

/* ═══════════ Parsing ═══════════ */
function _pick(obj, keys){
  for(const k of keys){ if(obj[k]!==undefined && obj[k]!==null && obj[k]!=='') return obj[k]; }
  return '';
}
// "Notify me on Done" column — a YES/NO flag per ticket, separate from the
// ticket's workflow Status. Column header name wasn't pinned down against
// the live cache, so we check every header this could plausibly be under,
// on BOTH sheets (ticLog master row first, Ticket/event row as fallback —
// e.g. if it's only ever set on the RESOLVED event row itself).
const NOTIFY_FLAG_KEYS = [
  'Notify_On_Done','NotifyOnDone','Notify On Done',
  'Notify_Status','NotifyStatus','Notify Status',
  'Notify_Flag','NotifyFlag','Notify Flag',
  'Notify','Notify_Me','NotifyMe','Notify Me',
  'Alert_On_Done','AlertOnDone','Alert_Me','AlertMe',
  'Send_Notification','SendNotification','Notification',
];
function isYesFlag(v){
  return /^(y|yes|true|1)$/i.test(String(v==null?'':v).trim());
}
// payload.Ticket rows — the real flow/event log (misleadingly named).
function parseEventRow(r){
  if(!r) return null;
  const ticketId = String(_pick(r,['Ticket_ID','ticketId'])||'').trim();
  const action = String(_pick(r,['Action','action'])||'').trim();
  const eventIdRaw = _pick(r,['Event_ID','eventId']);
  const eventId = Number(eventIdRaw);
  if(!ticketId || !action || !eventIdRaw || Number.isNaN(eventId)) return null;
  return {
    eventId, ticketId, action,
    status: String(_pick(r,['Status','status'])||'').trim(),
    from: String(_pick(r,['From','from'])||'').trim(),
    performedBy: String(_pick(r,['Performed_By','performedBy'])||'').trim(),
    to: String(_pick(r,['To','to'])||'').trim(),
    detail: String(_pick(r,['Detail','detail'])||'').trim(),
    notifyRaw: _pick(r, NOTIFY_FLAG_KEYS),
    local: false,
  };
}
// payload.ticLog rows — the per-ticket master/creation record (misleadingly named).
function parseMasterRow(r){
  if(!r) return null;
  const ticketId = String(_pick(r,['Ticket_ID','ticketId'])||'').trim();
  if(!ticketId) return null;
  return {
    ticketId,
    creationEventId: Number(_pick(r,['Event_ID','eventId'])) || null,
    createdBy: String(_pick(r,['Created_By','createdBy'])||'').trim(),
    subjectType: String(_pick(r,['Subject_Type','subjectType'])||'Employee').trim(),
    subjectId: String(_pick(r,['Subject_ID','subjectId'])||'').trim(), // <-- Subject Employee (E2)
    assignedToInitial: String(_pick(r,['Assigned_To','assignedTo','AssignedTo','Assigned To'])||'').trim(),
    assignmentType: String(_pick(r,['Assignment_Type','assignmentType','AssignmentType','Assignment Type'])||'').trim(),
    priority: String(_pick(r,['Priority','priority'])||'Medium').trim(),
    status: String(_pick(r,['Status','status'])||'').trim(),
    notes: String(_pick(r,['Notes','notes','Note'])||'').trim(),
    notifyRaw: _pick(r, NOTIFY_FLAG_KEYS),
    local: false,
  };
}
// Resolve the notify-on-done flag for a ticket: ticLog (master) row wins if
// it has a value; fall back to the RESOLVED event row's own value; default
// to notifying if neither cache sheet has the column populated. Tickets
// created through OpsDeck itself always write an explicit YES/NO, so this
// default only matters for legacy/imported rows whose Notify column was
// never set — and the spec requires the generator be notified on resolve
// unconditionally, so a missing column should not silently suppress that.
function notifyFlagFor(tid, resolvedEvent){
  const m = master(tid);
  if(m && m.notifyRaw!==undefined && m.notifyRaw!=='') return isYesFlag(m.notifyRaw);
  if(resolvedEvent && resolvedEvent.notifyRaw!==undefined && resolvedEvent.notifyRaw!=='') return isYesFlag(resolvedEvent.notifyRaw);
  return true;
}

// Icons for the Department/Person route-toggle (New Ticket drawer + Delegate modal)
const ICON_DEPARTMENT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V7l6-4 6 4v14"/><path d="M10 21v-6h4v6"/><path d="M10 10h.01M14 10h.01M10 14h.01M14 14h.01"/></svg>`;
const ICON_PERSON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;
let EVENTS = [];
let TICKET_MASTER = {};
let SUBJECT_EMPLOYEE_COLUMN_SEEN = false;

// A ticket can land in ticLog (master/creation record) before its Ticket
// (flow/event log) row is written — or that write can be missed entirely.
// Per requirement: check ticLog FIRST to know a ticket exists and how it
// was routed; the rest of its flow (accept/transfer/etc.) is then read
// from the real event log as normal. So for any master row with zero
// matching event rows, synthesize its CREATED event straight off the
// master record — status NEW, routed to whatever Assigned_To/Assignment_Type
// said — so it still shows up as open/unclaimed for that Department or
// Person instead of silently not existing anywhere.
function synthesizeMissingCreatedEvents(){
  const seen = new Set(EVENTS.map(e=>e.ticketId));
  const synthesized = [];
  Object.values(TICKET_MASTER).forEach(m=>{
    if(seen.has(m.ticketId)) return; // already has real event rows — trust those fully
    if(!m.assignedToInitial){
      console.warn('[OpsDeck] ticLog row for', m.ticketId, 'has no Assigned_To value — cannot route it into a queue yet.', m);
      return;
    }
    synthesized.push({
      eventId: m.creationEventId || genEventId(),
      ticketId: m.ticketId,
      action: 'CREATED',
      status: m.status || 'NEW',
      from: '',
      performedBy: m.createdBy,
      to: m.assignedToInitial,
      detail: m.notes || '(no description provided)',
      local: false,
      synthesized: true,
    });
  });
  if(synthesized.length){
    EVENTS = EVENTS.concat(synthesized).sort((a,b)=>a.eventId-b.eventId);
  }
}

function rebuildFromRealCache(eventRowsRaw, masterRowsRaw){
  EVENTS = (eventRowsRaw||[]).map(parseEventRow).filter(Boolean);
  EVENTS.sort((a,b)=>a.eventId-b.eventId);
  TICKET_MASTER = {};
  (masterRowsRaw||[]).map(parseMasterRow).filter(Boolean).forEach(m=>{ TICKET_MASTER[m.ticketId]=m; });
  SUBJECT_EMPLOYEE_COLUMN_SEEN = Object.values(TICKET_MASTER).some(m=>m.subjectId);
  synthesizeMissingCreatedEvents();
  discoverDirectory(EVENTS, TICKET_MASTER);
  applyOverlay(); // replay this browser's own local tickets/events on top
  trackMaxEventId(EVENTS); // covers real cache rows + this browser's saved local rows, whatever scale each uses
  discoverDirectory(EVENTS, TICKET_MASTER); // re-scan including anything the overlay introduced
}

function ingestFromCachePayload(payload){
  if(!payload) return false;
  // payload.Ticket = flow/event log; payload.ticLog = per-ticket master.
  const eventRows = Array.isArray(payload.Ticket) ? payload.Ticket
    : (Array.isArray(payload) ? payload : null);
  // Users must be parsed even when there are no tickets yet — otherwise an
  // empty ticket log leaves USERS_READY stuck false forever and the app
  // never gets past "Signing you in…", even though the Users cache landed fine.
  parseUsers(payload);
  if(!eventRows || !eventRows.length){
    discoverDirectory(EVENTS, TICKET_MASTER); // re-sync STAFF/DEPARTMENTS now that Users may have just arrived
    return false;
  }
  const masterRows = Array.isArray(payload.ticLog) ? payload.ticLog : [];
  rebuildFromRealCache(eventRows, masterRows);
  return true;
}

async function loadTickets(){
  const alreadyHaveData = EVENTS.some(r=>!r.local);
  try{
    const payload = await _readCache();
    const applied = ingestFromCachePayload(payload);
    if(applied){
      safeRender();
      refreshOpenDrawer();
    } else if(!alreadyHaveData){
      discoverDirectory(EVENTS, TICKET_MASTER);
      safeRender();
    }
  }catch(err){
    console.error('[OpsDeck] loadTickets error:', err);
  }
}
let _emptyReadStreak = 0;
async function _applyFromCache(){
  try{
    const payload = await _readCache();
    const applied = ingestFromCachePayload(payload);
    if(applied){ _emptyReadStreak = 0; safeRender(); refreshOpenDrawer(); }
    else if(EVENTS.some(r=>!r.local)){
      _emptyReadStreak++;
      if(_emptyReadStreak>=2){ EVENTS = EVENTS.filter(r=>r.local); TICKET_MASTER={}; discoverDirectory(EVENTS, TICKET_MASTER); applyOverlay(); safeRender(); _emptyReadStreak=0; }
    }
  }catch(e){
    console.warn('[OpsDeck] background refresh error:', e.message);
  }
}
try{
  AP2CacheWatcher.init();
  AP2CacheWatcher.subscribe(()=>{ _applyFromCache(); loadEmployees(); });
}catch(e){
  console.warn('[OpsDeck] cacheWatcher wiring failed, continuing without live updates:', e.message);
}
window.addEventListener('message', (e)=>{
  if(!e.data) return;
  if(e.data.type==='ap-theme' && e.data.theme){ document.documentElement.setAttribute('data-theme', e.data.theme); }
  // Parent proactively pushes every dataset it holds the moment it's ready —
  // ticket log AND the employee roster both need to render the instant
  // their slice lands, same as docPortal's emp/bike/log keys.
  if(e.data.type==='ap-cache-preload' && e.data.datasets){
    const payload = e.data.datasets[_AP2_CACHE_KEY];
    if(ingestFromCachePayload(payload)){ safeRender(); refreshOpenDrawer(); }
    const empRows = e.data.datasets[_AP2_CACHE_KEY_EMP];
    if(Array.isArray(empRows) && empRows.length) applyEmployeeRows(empRows);
  }
  if(e.data.type==='ap-cache-ready' && e.data.key===_AP2_CACHE_KEY){
    if(ingestFromCachePayload(e.data.data)){ safeRender(); refreshOpenDrawer(); }
  }
  if(e.data.type==='ap-cache-ready' && e.data.key===_AP2_CACHE_KEY_EMP){
    applyEmployeeRows(e.data.data);
  }
  if(e.data.type==='ap-cache-updated'){
    [_AP2_CACHE_KEY, _AP2_CACHE_KEY_EMP].forEach(key=>{
      try{ window.parent.postMessage({type:'ap-cache-request', key}, '*'); }catch(err){}
    });
  }
});
[_AP2_CACHE_KEY, _AP2_CACHE_KEY_EMP].forEach(key=>{
  try{ window.parent.postMessage({type:'ap-cache-request', key}, '*'); }catch(e){}
});

/* ═══════════ Ticket accessors ═══════════ */
function allTicketIds(){ return [...new Set(EVENTS.map(r=>r.ticketId))]; }
function ticketEvents(tid){ return EVENTS.filter(r=>r.ticketId===tid).sort((a,b)=>a.eventId-b.eventId); }
function ticketTimeline(tid){ return ticketEvents(tid); }
function master(tid){ return TICKET_MASTER[tid] || null; }
// Terminal = no further reminders/alarms should fire and the ticket drops
// out of "open" counts. RESOLVED is the only terminal status the real
// ap2_ticLog vocabulary emits today; CLOSED is included defensively so
// that if/when the backend ever adds a distinct Closed state, every
// reminder-stopping, counting, and filtering code path here (tickReminderEngine,
// myOpenCount, deptQueueCount, orgOpenCount, matchesStatusFilter, overdueInfo)
// picks it up immediately with no further changes needed.
function isTerminal(status){ return status==='RESOLVED' || status==='CLOSED'; }
function ticketTitle(tid){ const m=master(tid); return (m && m.notes) || 'Untitled ticket'; }
// Same calendar day check as demo fast-forward's "now" (nowMs()), so this
// tracks the demo clock instead of real wall-clock time when it's been
// fast-forwarded.
function isSameCalendarDay(msA, msB){
  const a = dubaiParts(msA), b = dubaiParts(msB);
  return a.year===b.year && a.month===b.month && a.day===b.day;
}
// Tickets that: (1) this user either CREATED or DELEGATED (i.e. performed a
// TRANSFERRED event on — routing it to a department queue or straight to a
// person), (2) were marked RESOLVED today, (3) have the ticLog/Ticket
// "notify" column set to YES. Newest first. Event_ID doubles as an
// epoch-ms timestamp (see event-log parsing above), so the RESOLVED
// event's own eventId is used as its "done at" time.
function todaysNotifiableResolutions(userId){
  if(!userId) return [];
  const now = nowMs();
  const out = [];
  allTicketIds().forEach(tid=>{
    const m = master(tid);
    if(!m) return;
    const iCreated = m.createdBy===userId;
    const iDelegated = !iCreated && ticketEvents(tid).some(e=> e.action==='TRANSFERRED' && e.performedBy===userId);
    if(!iCreated && !iDelegated) return;
    let latestResolved = null;
    EVENTS.forEach(e=>{
      if(e.ticketId===tid && e.action==='RESOLVED' && (!latestResolved || e.eventId>latestResolved.eventId)) latestResolved = e;
    });
    if(!latestResolved) return;
    if(!isSameCalendarDay(latestResolved.eventId, now)) return;
    if(!notifyFlagFor(tid, latestResolved)) return;
    out.push({ticketId:tid, resolvedEvent:latestResolved, via: iCreated ? 'created' : 'delegated'});
  });
  out.sort((a,b)=>b.resolvedEvent.eventId - a.resolvedEvent.eventId);
  return out;
}
// currentOwner(): the CURRENT, changing state of a ticket — status and who
// it's with come straight off the latest event row (no derivation/regex
// needed, the real log already carries Status per row). Fixed facts
// (Subject Employee/E2, Requester, original Priority) come from the
// ticket's master row and never change, exactly per the Fixed/Changing
// split in the requirement (§9).
function currentOwner(tid){
  const evs = ticketEvents(tid);
  if(!evs.length) return null;
  const latest = evs[evs.length-1];
  const m = master(tid) || {};
  return {
    status: latest.status || 'NEW',
    assignedTo: latest.to,
    performedBy: latest.performedBy,
    action: latest.action,
    eventId: latest.eventId,
    priority: m.priority || 'Medium',
    subjectId: m.subjectId || '',       // Subject Employee (E2) — fixed
    subjectType: m.subjectType || 'Employee',
    createdBy: m.createdBy || (evs[0] && evs[0].performedBy) || '',
  };
}

/* ═══════════ Activity-trail accessors — "I did X" / "my department did X"
   These read the whole event log for a given action, not just the
   ticket's current state, so a ticket you accepted or transferred still
   shows up here even after it's since moved on to someone else. ═══════════ */
function ticketsWhereIActed(actorId, action){
  return allTicketIds().filter(tid=>
    ticketEvents(tid).some(e=> e.action===action && e.performedBy===actorId)
  );
}
function ticketsWhereDeptActed(deptId, action){
  return allTicketIds().filter(tid=>
    ticketEvents(tid).some(e=>{
      if(e.action!==action) return false;
      const s = staff(e.performedBy);
      return s && s.dept===deptId;
    })
  );
}
function deptRaised(deptId){
  return allTicketIds().filter(tid=>{
    const m = master(tid);
    if(!m || !m.createdBy) return false;
    const s = staff(m.createdBy);
    return s && s.dept===deptId;
  });
}
// A TRANSFERRED event's `to` is either a department name (isDeptToken) or
// a person code/email — this is how "Transferred" (to a department queue)
// is split from "Delegated" (directly to a person).
function isTransferToDept(e){ return isDeptToken(e.to); }
function actedTransferred(actorId, kind){ // kind: 'dept' | 'person'
  return allTicketIds().filter(tid=>
    ticketEvents(tid).some(e=> e.action==='TRANSFERRED' && e.performedBy===actorId &&
      (kind==='dept' ? isTransferToDept(e) : !isTransferToDept(e)))
  );
}
function deptActedTransferred(deptId, kind){
  return allTicketIds().filter(tid=>
    ticketEvents(tid).some(e=>{
      if(e.action!=='TRANSFERRED') return false;
      const s = staff(e.performedBy);
      if(!s || s.dept!==deptId) return false;
      return kind==='dept' ? isTransferToDept(e) : !isTransferToDept(e);
    })
  );
}
// "Accepted" also absorbs anything I/my department Transferred or
// Delegated that has SINCE been accepted by the recipient — once accepted
// it's no longer sitting open under Transferred/Delegated, it moves here.
function myAccepted(u){
  const selfAccepted = ticketsWhereIActed(u.id,'ACCEPTED');
  const nowAccepted = [...actedTransferred(u.id,'dept'), ...actedTransferred(u.id,'person')]
    .filter(tid=> currentOwner(tid).status!=='NEW');
  return [...new Set([...selfAccepted, ...nowAccepted])];
}
// Transferred (by me) — anything I sent out, whether to a department queue
// or straight to a person, that's still sitting unclaimed.
function myTransferred(u){
  return [...actedTransferred(u.id,'dept'), ...actedTransferred(u.id,'person')]
    .filter(tid=> currentOwner(tid).status==='NEW');
}
// Delegated (to me) — anything someone else put directly in my hands (at
// creation or via a later transfer) that I haven't accepted yet.
function myDelegated(u){
  return allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.status==='NEW' && o.assignedTo===u.id && o.performedBy!==u.id;
  });
}
function deptAccepted(deptId){
  const selfAccepted = ticketsWhereDeptActed(deptId,'ACCEPTED');
  const nowAccepted = [...deptActedTransferred(deptId,'dept'), ...deptActedTransferred(deptId,'person')]
    .filter(tid=> currentOwner(tid).status!=='NEW');
  return [...new Set([...selfAccepted, ...nowAccepted])];
}
function deptTransferred(deptId){ return deptActedTransferred(deptId,'dept').filter(tid=> currentOwner(tid).status==='NEW'); }
function deptDelegated(deptId){ return deptActedTransferred(deptId,'person').filter(tid=> currentOwner(tid).status==='NEW'); }
// Everything still open and relevant to a person — accepted or not — used
// for the nav badge count and the profile "Open" stat.
function openForMe(u){
  return allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.assignedTo===u.id && !isTerminal(o.status);
  });
}
// "Attention" (My Portal tab) = tickets sitting with me by name that I
// haven't accepted yet — the moment I accept one it moves fully into
// "Accepted" below and drops out of this list (Done / Delegate / Transfer
// all live on the ticket from there).
function myAttention(u){
  return allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.assignedTo===u.id && o.status==='NEW';
  });
}
// Department Attention = only what's still sitting unclaimed in the queue
// (no specific person assigned yet). The moment someone accepts one, it's
// assigned to them by name and moves to THEIR My Portal instead — a
// ticket needing attention lives in exactly one place, never both.
function openForDept(deptId){
  const d = dept(deptId);
  if(!d) return [];
  return allTicketIds().filter(tid=>{
    const o = currentOwner(tid);
    return o && o.status==='NEW' && deptNameOfTarget(o.assignedTo)===d.name;
  });
}
// Row label that makes it obvious whether a ticket is still sitting
// unclaimed (before ACCEPTED) or actively with someone (after).
function openRowSubLabel(tid){
  const o = currentOwner(tid);
  if(o.status==='NEW') return `Unclaimed — waiting in ${deptNameOfTarget(o.assignedTo)}`;
  return `With ${nameOf(o.assignedTo)}`;
}

/* ═══════════ Reminder engine (computed live from the event log) ═══════════
   A REMINDER event's Detail carries its own due date/time ("Reminder:
   10-Aug-2026 15:00"); Event_ID is deliberately NOT used for this — it's
   the flow-ordering timestamp, not necessarily wall-clock accurate far
   into a demo, whereas the Detail's due date is the actual commitment
   made on the ticket. A REMINDER is "live" (can go overdue) until either
   a REMINDER_ATTENDED, a newer REMINDER, or a terminal/hold status
   supersedes it. */
function latestLiveReminder(tid){
  const evs = ticketEvents(tid);
  let live = null;
  for(const e of evs){
    if(e.action==='REMINDER') live = e;
    else if(e.action==='REMINDER_ATTENDED') live = null;
  }
  return live;
}
// Full state of the ticket's current reminder cycle: which REMINDER is in
// effect, and — if it's been attended — the REMINDER_ATTENDED event that
// closed it. A newer REMINDER always starts a fresh cycle (attendedAt
// resets), matching latestLiveReminder()'s semantics above.
function reminderCycleState(tid){
  const evs = ticketEvents(tid);
  let liveReminder = null, attendedAt = null;
  for(const e of evs){
    if(e.action==='REMINDER'){ liveReminder = e; attendedAt = null; }
    else if(e.action==='REMINDER_ATTENDED' && liveReminder){ attendedAt = e; }
  }
  return {liveReminder, attendedAt};
}
// Tickets currently assigned to this user that have at least one
// REMINDER_ALERT fired in the current cycle (either "overdue, unattended"
// or "attended but still pending") and aren't resolved/on-hold yet.
// Unlike the toast in notifyReminderAlarm() — which fires once and is gone
// the moment it's dismissed or missed — this is recomputed fresh on every
// render, so a reminder alert stays discoverable from the bell for as long
// as it's genuinely still outstanding, matching how "done today" persists
// in the same dropdown.
function activeReminderAlerts(userId){
  if(!userId) return [];
  const out = [];
  allTicketIds().forEach(tid=>{
    const owner = currentOwner(tid);
    if(!owner || owner.assignedTo!==userId) return;
    if(isTerminal(owner.status) || owner.status==='ON HOLD') return;
    const {liveReminder, attendedAt} = reminderCycleState(tid);
    if(!liveReminder) return;
    const evs = ticketEvents(tid);
    const baseline = attendedAt ? attendedAt.eventId : liveReminder.eventId;
    const lastAlert = [...evs].reverse().find(e=> e.action==='REMINDER_ALERT' && e.eventId>baseline);
    if(!lastAlert) return; // no alert has actually fired yet for this cycle
    out.push({ticketId:tid, alertEvent:lastAlert, attended:!!attendedAt});
  });
  out.sort((a,b)=>b.alertEvent.eventId - a.alertEvent.eventId);
  return out;
}
function overdueInfo(tid){
  const owner = currentOwner(tid);
  if(!owner) return {overdue:false};
  if(isTerminal(owner.status) || owner.status==='ON HOLD') return {overdue:false};
  const r = latestLiveReminder(tid);
  if(!r) return {overdue:false};
  const dueAt = parseReminderDetail(r.detail);
  if(!dueAt) return {overdue:false};
  const now = nowMs();
  if(now < dueAt) return {overdue:false, dueAt};
  return {overdue:true, elapsed: now-dueAt, dueAt};
}
// Runs continuously (real wall-clock time, not just the demo fast-forward
// clock) for every ticket currently assigned to whoever is logged into
// this browser — so reminders always follow the ticket's current handler
// after a transfer/delegate (a re-assigned ticket's alarms simply start
// following whoever it's now with, the next time they load/poll).
//   • First alert fires the moment a reminder's due time passes.
//   • If still unattended, another alert fires every 30 minutes after that.
//   • Once attended, if the ticket is still not resolved, an hourly
//     "still pending" alarm takes over — and keeps going, day after day,
//     until the ticket is resolved (or put on hold).
//   • Resolving the ticket stops everything immediately (isTerminal check
//     below); attending a reminder never resolves it on its own.
function tickReminderEngine(){
  const uid = state.currentUserId;
  if(!uid) return;
  const now = nowMs();
  allTicketIds().forEach(tid=>{
    const owner = currentOwner(tid);
    if(!owner || owner.assignedTo!==uid) return; // only alarm for the ticket's current handler
    if(isTerminal(owner.status) || owner.status==='ON HOLD') return; // stop on resolve/hold
    const {liveReminder, attendedAt} = reminderCycleState(tid);
    if(!liveReminder) return; // no reminder set on this ticket
    const evs = ticketEvents(tid);

    if(!attendedAt){
      const dueAt = parseReminderDetail(liveReminder.detail);
      if(!dueAt || now < dueAt) return;
      const lastAlert = [...evs].reverse().find(e=> e.action==='REMINDER_ALERT' && e.eventId>liveReminder.eventId);
      if(!lastAlert || now - lastAlert.eventId >= 30*60000){
        fireReminderAlert(tid, 'Automated: reminder overdue, no response yet.');
      }
    } else {
      const lastAlarm = [...evs].reverse().find(e=> e.action==='REMINDER_ALERT' && e.eventId>attendedAt.eventId);
      const baseline = lastAlarm ? lastAlarm.eventId : attendedAt.eventId;
      if(now - baseline >= 60*60000){
        fireReminderAlert(tid, 'Automated: ticket still pending after reminder attended.');
      }
    }
  });
}

/* ═══════════ Mutations (append-only) ═══════════
   Writes now persist to the real backend — the same Apps Script /exec
   endpoint auth.js and dataLayer.js already talk to for reads — instead of
   staying browser-local. Every mutation below:
     1. Builds + commits its event row into EVENTS/TICKET_MASTER immediately
        (optimistic — the UI never blocks on network latency), then paints it.
     2. Awaits postAction(), which POSTs to /exec with this session's
        sessionId/token (from window.Auth, set on login by the OpsDeck
        suite's own login.html).
     3. On success: leaves the optimistic row in place — the next real
        cache read will supersede it with the server's canonical row anyway.
     4. On failure: rolls the optimistic row back out, re-renders, and
        rethrows so the caller (a modal's Confirm handler, the New Ticket
        drawer's Submit) can surface the error and let the user retry. */
const API_BASE = 'https://script.google.com/macros/s/AKfycbwrHCi1-Ur0L3Rns8sAPNVLkRH4UIXAxt3t6tQB-rnjtBDIMZPzGf5PNCOwaDMZYClI/exec';

// One write call. Sent as text/plain (not application/json) so Apps
// Script's doPost never triggers a CORS preflight — the same trick
// auth.js's destroySession beacon already uses against this exact endpoint.
// sessionId/token ride on every write so the backend authenticates the
// call itself; the client-supplied actorId is a display convenience only,
// never the thing the server should trust for who-did-this.
async function postAction(action, payload){
  const creds = window.Auth && window.Auth.getCredentials ? window.Auth.getCredentials() : null;
  if(!creds || !creds.sessionId || !creds.token){
    throw new Error('Your session has expired — please sign in again.');
  }
  let res;
  try{
    res = await fetch(API_BASE, {
      method: 'POST',
      headers: {'Content-Type':'text/plain'}, // avoid CORS preflight against /exec
      body: JSON.stringify({action, sessionId:creds.sessionId, token:creds.token, ...payload}),
    });
  }catch(networkErr){
    throw new Error('Could not reach the server — check your connection and try again.');
  }
  if(!res.ok) throw new Error(`Server error (HTTP ${res.status}) on "${action}".`);
  let json;
  try{ json = await res.json(); }
  catch(e){ throw new Error(`Server returned an unreadable response for "${action}".`); }
  if(!json || json.success===false){
    throw new Error((json && (json.error||json.message)) || `Server rejected "${action}".`);
  }
  return json;
}

let seq = 0;
// Real backend Event_IDs aren't guaranteed to be JS Date.now()-ms values —
// they can use a different numeric scale (e.g. a YYYYMMDDHHMMSS-style
// stamp), which can land far above a real-time ms value. If a new local
// event's id were just "now", it could sort as OLDER than a ticket's own
// real Created row, and currentOwner() (which trusts the highest eventId)
// would then keep reading the ticket as still NEW even after Accept/Done/
// Delegate — which is exactly the bug this fixes. maxKnownEventId tracks
// the highest eventId seen from ANY source (real cache rows, synthesized
// rows, overlay rows) so every new local event is guaranteed to sort after
// all of them, regardless of what scale the backend's IDs use.
let maxKnownEventId = 0;
function trackMaxEventId(list){
  (list||[]).forEach(e=>{ const v = Number(e && e.eventId) || 0; if(v > maxKnownEventId) maxKnownEventId = v; });
}
function genEventId(){
  maxKnownEventId = Math.max(maxKnownEventId + 1, nowMs() + (seq++ % 900));
  return maxKnownEventId;
}
function nextTicketId(){
  let max = 5000;
  allTicketIds().forEach(tid=>{
    const m = String(tid).match(/(\d+)\s*$/);
    if(m) max = Math.max(max, parseInt(m[1],10));
  });
  return 'TK-' + (max+1);
}
function appendEvent({ticketId, action, status, from, performedBy, to, detail}){
  const row = {eventId:genEventId(), ticketId, action, status, from:from||'', performedBy:performedBy||'', to:to||'', detail:detail||'', local:true};
  EVENTS.push(row);
  LOCAL_EVENTS.push(row);
  saveOverlay();
  return row;
}
// Undo an appendEvent() — used when the matching server write fails, so a
// rejected mutation never leaves a "ghost" event behind in this browser.
function rollbackEvent(row){
  EVENTS = EVENTS.filter(e=>e!==row);
  LOCAL_EVENTS = LOCAL_EVENTS.filter(e=>e!==row);
  saveOverlay();
}

// Ticket creation: captures the fixed E2 (subjectEmployeeId) and lets the
// creator DELEGATE it straight to a department queue OR directly to a
// specific person in one step (requirement §5 vs §6, chosen at creation).
async function createTicket({creatorId, title, description, priority, subjectType, subjectEmployeeId, targetType, target, notifyOnDone}){
  const ticketId = nextTicketId();
  const ev = appendEvent({
    ticketId, action:'CREATED', status:'NEW',
    from:'', performedBy:creatorId, to:target,
    detail: description || title,
  });
  const m = {
    ticketId, creationEventId: ev.eventId, createdBy:creatorId,
    subjectType: subjectType||'Employee', subjectId: subjectEmployeeId,
    assignedToInitial: target, assignmentType: targetType==='department' ? 'DEPARTMENT' : 'PERSON',
    priority: priority||'Medium', notes: title, local:true,
    // "Notify me when done" toggle picked in the New Ticket drawer — stored
    // in the same notifyRaw slot the real ap2_ticLog cache's YES/NO column
    // would fill, so notifyFlagFor()/todaysNotifiableResolutions() treat a
    // locally-created ticket exactly like one that arrived from the cache.
    notifyRaw: notifyOnDone===false ? 'NO' : 'YES',
  };
  TICKET_MASTER[ticketId] = m;
  LOCAL_MASTERS[ticketId] = m;
  discoverDirectory(EVENTS, TICKET_MASTER);
  saveOverlay();
  safeRender(); // paint the new ticket immediately, before the server confirms
  try{
    await postAction('createTicket', {
      ticketId, eventId: ev.eventId, creatorId, title, description,
      priority: m.priority, subjectType: m.subjectType, subjectEmployeeId,
      targetType: m.assignmentType, target, notifyOnDone: m.notifyRaw,
    });
  }catch(err){
    rollbackEvent(ev);
    delete TICKET_MASTER[ticketId];
    delete LOCAL_MASTERS[ticketId];
    saveOverlay();
    discoverDirectory(EVENTS, TICKET_MASTER);
    safeRender();
    throw err;
  }
  return ticketId;
}

// System-fired (no human click) — covers both the pre-attendance 30-min
// escalation and the post-attendance hourly pending alarm; detail text
// tells them apart (see tickReminderEngine). Unlike user-initiated
// mutations this does NOT roll back the optimistic event on a failed
// write — rolling back would make it fire again on the very next check,
// turning a network hiccup into a beep storm. It's logged instead, and
// the next scheduled check simply carries on from there.
async function fireReminderAlert(ticketId, detail){
  const owner = currentOwner(ticketId);
  if(!owner) return;
  const actorId = owner.assignedTo;
  const ev = appendEvent({ticketId, action:'REMINDER_ALERT', status:owner.status, from:owner.assignedTo, performedBy:owner.assignedTo, to:owner.assignedTo, detail});
  playBeep();
  notifyReminderAlarm(ticketId, detail);
  safeRender();
  try{
    await postAction('reminderAlertTicket', {ticketId, eventId: ev.eventId, actorId, detail});
  }catch(err){
    console.warn('[OpsDeck] reminder alert failed to persist (will not re-fire immediately):', err.message);
  }
}
// Short two-tone beep via WebAudio — no external asset needed. Browsers
// block audio until the page has seen at least one user interaction
// (click/tap), which is a browser policy, not something a demo/mutation
// flag can bypass — the very first alarm after page load may arrive
// silently (with the visible notification still showing) until then.
let _audioCtx = null;
function playBeep(){
  try{
    if(!_audioCtx) _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = _audioCtx;
    if(ctx.state==='suspended') ctx.resume();
    const tone = (delay)=>{
      setTimeout(()=>{
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime+0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+0.35);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime+0.36);
      }, delay);
    };
    tone(0); tone(450);
  }catch(e){
    console.warn('[OpsDeck] beep failed:', e.message);
  }
}
// Persistent on-screen alarm — same pattern as notifyTicketDone (the
// "ticket resolved" popup), amber-accented to read as an alert rather
// than a completion. Stays until dismissed or clicked through.
function notifyReminderAlarm(ticketId, detail){
  const wrap = document.getElementById('notifWrap');
  if(!wrap) return;
  const m = master(ticketId);
  const title = m && m.notes ? m.notes : ticketId;
  const el = document.createElement('div');
  el.className = 'notif-box notif-alarm';
  el.innerHTML = `
    <span class="notif-icon">${ICON_BELL}</span>
    <span class="notif-body">
      <div class="notif-title">${escHtml(ticketId)} — reminder alarm</div>
      <div class="notif-sub">${escHtml(title)} · ${escHtml(detail)} — click to view</div>
    </span>
    <button type="button" class="notif-close" aria-label="Dismiss">✕</button>`;
  el.addEventListener('click', (e)=>{
    if(e.target.closest('.notif-close')){ el.remove(); return; }
    el.remove();
    openTicketInFlow(ticketId);
  });
  wrap.appendChild(el);
}

/* ═══════════ Identity — real login, not a switcher ═══════════
   Who's signed in comes from ap_session (written by the rest of the OpsDeck
   suite on login), exactly like the original OpsDeck.html — the log's
   role/department for that person is then resolved from the Users
   directory via metaFor(), same machinery the old "Acting as" bar used,
   just pinned to one real identity instead of being switchable. */
function _readSession(){
  try{
    const raw = sessionStorage.getItem('ap_session');
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    const s = Array.isArray(parsed) ? parsed[0] : parsed;
    if(!s || !s.email) return null;
    return s;
  }catch(e){ return null; }
}
// Fallback used only when this file is opened standalone (no ap_session yet)
// so the portal still renders something sensible while login is wired up —
// falls back to the first known user in the connected Users sheet.
const FALLBACK_SESSION = {};
let ME = null; // the signed-in staff id (email), set once at boot
function bootstrapIdentity(){
  const session = _readSession() || FALLBACK_SESSION;
  let email = String(session.email||'').trim();
  if(!email && USERS_LIST.length) email = USERS_LIST[0].email; // last-resort so the portal still renders
  const known = userFor(email);
  if(known) email = known.email; // normalize casing to match the real Users row
  // Real ap_session carries the signed-in user's own name/role directly —
  // capture it so their designation/department/name are known immediately,
  // instead of only once the Users cache has loaded.
  SESSION_IDENTITY = session.email ? {
    email: String(session.email).trim(),
    name: String(session.name||'').trim(),
    ...parseSessionRole(session.role),
  } : null;
  return email || null;
}

// Cache reads (Users, ap2_employee) finish asynchronously and can land after
// the New Ticket drawer is already open. Follows docPortal's
// _refreshOpenDropdowns()/filterDrop() method: a live cache update never
// rebuilds the whole form. It patches only the piece(s) that are backed by
// that cache, in place — same input/list DOM nodes, same focus, same
// mid-interaction state — instead of replacing drawerBody.innerHTML wholesale.
// That whole-body rebuild was the bug: a cache update landing mid-click blew
// away the open Subject Employee list before the click could register, which
// looked like the dropdown "opening and closing" with nothing selected.
function refreshOpenDrawer(){
  const drawer = document.getElementById('ticketDrawer');
  const u = currentUser();

  // ap2_employee cache: mirrors docPortal's emp/bike dropdowns — if the

  // docPortal's `filterDrop(mode, document.getElementById(mode+'-search').value)`).
  // The input keeps its value and focus; nothing about the user's
  // in-progress click or keystroke is disturbed.
  const empInput = document.getElementById('ntSubjectInput');
  const empList = document.getElementById('ntSubjectList');
  if(empList && empList.classList.contains('open')){
    filterEmpDrop(empInput ? empInput.value : '');
  }
  // Cache-status ping: patched in place too, same as docPortal's
  // _updateCacheStatus() touching just the #cache-status dot/tooltip.
  const ping = drawer.querySelector('.cache-ping');
  if(ping){
    ping.classList.toggle('ok', EMPLOYEE_CACHE_OK);
    ping.classList.toggle('warn', !EMPLOYEE_CACHE_OK);
    ping.title = EMPLOYEE_CACHE_OK
      ? 'Employee roster loaded from ap2_employee cache'
      : 'ap2_employee cache unavailable — no employee roster loaded';
  }

  // Ticket-cache-derived department/person options: same non-destructive
  // refilter as the Subject Employee field above — if the "Route to" list
  // is currently open, re-run the filter against the latest
  // activeDeptOptions()/activePersonOptions() with whatever's already
  // typed. The input keeps its value and focus either way.
  const targetInput = document.getElementById('ntTargetInput');
  const targetList = document.getElementById('ntTargetList');
  if(targetList && targetList.classList.contains('open')){
    filterTargetDrop(targetInput ? targetInput.value : '');
  }
}

const ICON_BELL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>`;

    .filter(x=>!notifDismissed.has('D:'+x.ticketId+':'+x.resolvedEvent.eventId))
    .map(x=>({
      kind:'done', ticketId:x.ticketId, sortKey:x.resolvedEvent.eventId,
      dismissKey:'D:'+x.ticketId+':'+x.resolvedEvent.eventId,
      icon:ICON_TICKET, kindLabel:'Ticket', title:`${x.ticketId} is now Done`,
      sub:`${ticketTitle(x.ticketId)} · ${x.via==='delegated'?'delegated by you':'created by you'}`,

    .filter(x=>!notifDismissed.has('R:'+x.ticketId+':'+x.alertEvent.eventId))
    .map(x=>({

function renderView(u){

  if(!gm && state.view==='org') state.view='my';
  switch(state.view){
    case 'my': return renderMyPortal(u);
    case 'dept': return manager ? renderDeptPortal(u) : renderDeptReadOnly(u);
    case 'flow': return renderFlowFinder(u);
    case 'org': return renderOrgOverview(u);
    default: return '';
  }
}
// Human-readable label for a top-level view key, used on Flow Finder's

// ----- Ticket row renderer -----
function actionLabel(action){
  return {
    CREATED:'Created', ASSIGNED:'Assigned', ACCEPTED:'Accepted', COMMENT:'Comment',
    ON_HOLD:'On hold', RESUMED:'Resumed', REMINDER:'Reminder set',
    REMINDER_ALERT:'Reminder overdue', REMINDER_ATTENDED:'Reminder attended',
    TRANSFERRED:'Transferred', RESOLVED:'Resolved',
  }[action] || action;
}
function ticketRow(tid, opts={}){
  const owner = currentOwner(tid);
  const title = ticketTitle(tid);
  const od = overdueInfo(tid);
  const subLabel = opts.subLabel || `With ${nameOf(owner.assignedTo)}`;
  return `
  <div class="ticket-row" data-open-ticket="${tid}">
    <div class="pri-flag pri-${owner.priority}"></div>
    <div class="t-main">
      <div class="t-title">${escHtml(title)} <span class="tid">#${tid}</span> ${owner.subjectType?`<span class="type-chip">${escHtml(owner.subjectType)}</span>`:''}</div>
      <div class="t-sub">For ${owner.subjectId ? nameOf(owner.subjectId) : '—'} · ${subLabel} · raised by ${nameOf(owner.createdBy)}</div>
    </div>
    ${od.overdue ? `<div class="overdue-flag">⚠ overdue ${fmtDur(od.elapsed)}</div>` : ''}
    <div class="status-chip ${statusClass(owner.status)}">${statusDisplayLabel(owner.status)}</div>
  </div>`;
}

// ----- My Portal -----
function raisedByMe(u){
  // Tickets this person created (ticLog's Created_By), regardless of who
  // currently owns them — separate from "assigned to me now" below, so a
  // ticket doesn't just vanish from view the moment it's accepted/
  // transferred elsewhere.
  return allTicketIds().filter(tid=>{
    const m = master(tid);
    return m && m.createdBy===u.id;
  }).sort((a,b)=> currentOwner(b).eventId - currentOwner(a).eventId);
}
function activityRow(tid){
  // For "I accepted" / "I transferred" lists: state is about what happened
  // on the ticket, so show where it stands now rather than the default
  // "With X" (which would just repeat the current owner regardless of
  // whether it's still with the person viewing this list).
  const o = currentOwner(tid);
  return ticketRow(tid, {subLabel: isTerminal(o.status) ? `Resolved` : openRowSubLabel(tid)});
}
function renderMyPortal(u){
  const filter = state.myStatusFilter;
  const byEventDesc = (a,b)=> currentOwner(b).eventId - currentOwner(a).eventId;
  // "Attention" = tickets with me by name that I haven't accepted yet.
  // Once accepted, a ticket moves out of Attention and lives in Accepted
  // from then on — that's where Done / Delegate / Transfer happen.
  const sections = {
    attention: myAttention(u).slice().sort(byEventDesc),
    raised: raisedByMe(u).slice().sort(byEventDesc),
    accepted: myAccepted(u).sort(byEventDesc),
    transferred: myTransferred(u).sort(byEventDesc),
    delegated: myDelegated(u).sort(byEventDesc),
  };

  const body = filter==='all'
    ? mergedTicketList(sections)
    : (sections[filter] && sections[filter].length
        ? `<div class="ticket-list">${sections[filter].map(t=>activityRow(t)).join('')}</div>`
        : `<div class="empty"><b>Nothing here.</b>No tickets in ${categoryFilterLabel(filter)} right now.</div>`);

  return `
  <h1 class="page-title">My Portal</h1>
  <p class="page-sub">Tickets relevant to you, grouped by status.</p>
  ${categoryFilterBar(filter, 'mystatus')}
  ${body}
  `;
}

// "All" used to repeat every category (Attention/Raised/Accepted/
// Transferred/Delegated) as its own labelled sub-section — a ticket that's
// e.g. both something I raised AND currently have accepted showed up twice.
// This instead flattens every category into one deduped list, newest first,
// same as picking any single filter pill.
function mergedTicketList(sections){
  const seen = new Set();
  const ids = [];
  Object.values(sections).forEach(list=>{
    list.forEach(tid=>{ if(!seen.has(tid)){ seen.add(tid); ids.push(tid); } });
  });
  if(!ids.length) return `<div class="empty">Nothing here yet.</div>`;
  ids.sort((a,b)=> currentOwner(b).eventId - currentOwner(a).eventId);
  return `<div class="ticket-list">${ids.map(t=>activityRow(t)).join('')}</div>`;
}

function profileCard(u, extraClass=''){
  const d = u.dept ? dept(u.dept) : null;
  const openCt = openForMe(u).length;
  const resolvedCt = allTicketIds().filter(tid=>{
    const o=currentOwner(tid); return o && o.assignedTo===u.id && isTerminal(o.status);
  }).length;
  const requestedCt = raisedByMe(u).length;
  const roleName = designationOf(u.id) || (isGM(u.id) ? 'General Manager' : isManager(u.id) ? 'Manager' : 'Worker');
  return `
  <div class="card profile-card${extraClass?(' '+extraClass):''}">
    <div class="avatar">${nameOf(u.id).slice(0,2).toUpperCase()}</div>
    <h2>${nameOf(u.id)}</h2>
    <p class="role-line">${roleName}${d?` · ${d.name}`:''}</p>
    <div class="meta-row"><span>Email / code</span><span>${u.id}</span></div>
    ${d ? `<div class="meta-row"><span>Department</span><span>${d.name}</span></div>` : ''}
    <div class="stat-strip">
      <div class="stat-chip"><div class="n">${openCt}</div><div class="l">Open</div></div>
      <div class="stat-chip"><div class="n">${resolvedCt}</div><div class="l">Resolved</div></div>
      <div class="stat-chip"><div class="n">${requestedCt}</div><div class="l">Requested</div></div>
    </div>
  </div>`;
}

// ----- Department Portal -----
function renderDeptPortal(u){
  if(!isManager(u.id) || !u.dept) return renderMyPortal(u);
  return renderDeptReadOnly(u, {manager:true});
}
function renderDeptReadOnly(u, opts={}){
  const d = u.dept ? dept(u.dept) : null;
  if(!d) return renderMyPortal(u);
  const filter = state.deptStatusFilter;
  const byEventDesc = (a,b)=> currentOwner(b).eventId - currentOwner(a).eventId;
  const teamCount = deptWorkers(u.dept).length;

  const sections = {
    attention: openForDept(u.dept).slice().sort(byEventDesc),
    raised: deptRaised(u.dept).slice().sort(byEventDesc),
    accepted: deptAccepted(u.dept).sort(byEventDesc),
    transferred: deptTransferred(u.dept).sort(byEventDesc),
    delegated: deptDelegated(u.dept).sort(byEventDesc),
  };

  const body = filter==='all'
    ? mergedTicketList(sections)
    : (sections[filter] && sections[filter].length
        ? `<div class="ticket-list">${sections[filter].map(t=>activityRow(t)).join('')}</div>`
        : `<div class="empty"><b>Nothing here.</b>No tickets in ${categoryFilterLabel(filter)} for ${d.name}.</div>`);

  return `
  <h1 class="page-title">${d.name} — Department</h1>
  <p class="page-sub">${opts.manager ? `${d.name} · ${teamCount} member${teamCount===1?'':'s'}` : `Read-only view of ${d.name}'s tickets.`}</p>
  ${categoryFilterBar(filter, 'deptstatus')}
  ${body}
  `;
}

/* ═══════════ Flow Finder — Ticket, Subject Employee, Handler,
   Department, Status, Date range (requirement §10) */
function ticketTouchesDept(tid, deptIdOrName){
  const d = dept(deptIdOrName) || deptByName(deptIdOrName);
  if(!d) return false;
  return ticketEvents(tid).some(e=> deptNameOfTarget(e.to)===d.name || deptNameOfTarget(e.from)===d.name)
    || (d.id!=null && deptWorkers(d.id).some(w=> ticketEvents(tid).some(e=>e.performedBy===w.id || e.to===w.id)));
}
function ticketNumOf(tid){
  const m = String(tid||'').match(/(\d+)/);
  return m ? parseInt(m[1],10) : 0;
}

// Both Flow Finder popovers (category list, date range) live inside
// .ff-toolbar, which scrolls horizontally when the row is too wide for
// the screen. An absolutely-positioned panel would get clipped by that
// scroll container, so the panels are `position:fixed` in CSS and have
// their on-screen spot computed here from the trigger's real position —
// fixed elements aren't clipped by an ancestor's overflow, so the panel
// stays fully visible no matter how far the toolbar has scrolled.
function positionFfPanel(triggerEl, panelEl, align){
  if(!triggerEl || !panelEl) return;
  const r = triggerEl.getBoundingClientRect();
  const vw = window.innerWidth;
  panelEl.style.top = (r.bottom + 6) + 'px';
  const pw = panelEl.offsetWidth || 240;
  let left = align==='right' ? (r.right - pw) : r.left;
  left = Math.max(8, Math.min(left, vw - pw - 8));
  panelEl.style.left = left + 'px';
}
// Closes whichever Flow Finder popover is open when its scroll-anchor
// moves out from under it (toolbar scrolled horizontally, or the page
// itself scrolled/resized) instead of leaving it floating in the wrong
// spot — simpler and less jarring than re-tracking it live.
function ffPanelScrollGuard(){
  let closed = false;
  if(mselState('ffCatSel').open){ mselState('ffCatSel').open = false; mselState('ffCatSel').q=''; closed = true; }
  if(state.ffDateOpen){ state.ffDateOpen = false; closed = true; }
  ['ffHandlerMsel','ffDeptMsel'].forEach(id=>{
    if(mselState(id).open){ mselState(id).open = false; mselState(id).q = ''; closed = true; }
  });
  const subjList = document.getElementById('ffSubjectList');
  if(subjList && subjList.classList.contains('open')){ closeFfSubjDrop(); }
  if(closed) render();
}
function wireFfCategorySelect(){
  const id = 'ffCatSel';
  const root = document.getElementById(id);
  if(!root) return;
  const toggle = root.querySelector('[data-ffcat-toggle]');
  if(toggle) toggle.onclick = (e)=>{
    e.stopPropagation();
    const st = mselState(id);
    const wasOpen = st.open;
    mselCloseAllExcept(id);
    st.open = !wasOpen;
    if(!st.open) st.q = '';
    render();
    if(st.open){
      document.addEventListener('mousedown', mselOutsideHandler, true);
      setTimeout(()=>{ const inp = document.getElementById(id+'-search'); if(inp) inp.focus(); }, 0);
    }
  };
  const panel = root.querySelector('[data-ffcat-panel]');
  if(panel){
    panel.onmousedown = (e)=> e.stopPropagation();
    positionFfPanel(toggle, panel, 'left');
  }
  root.querySelectorAll('[data-ffcat-option]').forEach(opt=>{
    opt.onclick = (e)=>{
      e.stopPropagation();
      const val = opt.dataset.ffcatOption;
      if(val !== state.ffMode){
        state.ffMode = val; state.ffQuery=''; state.ffMulti=[]; state.ffSelectedTicket=null;
        // ffFrom/ffTo deliberately left alone — the date range is now
        // universal and should survive a category switch.
      }
      mselState(id).open = false;
      mselState(id).q = '';
      render();
    };
  });
  const search = document.getElementById(id+'-search');
  if(search) search.oninput = ()=>{ mselState(id).q = search.value; render(); };
}
function ffDateOutsideHandler(e){
  const wrap = document.getElementById('ffDateFilter');

// Toolbar is a fresh DOM node every render, so its scroll listener needs
// re-attaching each time; the window resize listener only needs adding
// once (window persists across renders).
let _ffResizeGuardAttached = false;
function wireFfToolbarScrollGuard(){

// Flow Finder's own result row — same data as ticketRow() but with the
// ticket number pinned to the left as a badge (results are always sorted
// newest-ticket-first), used only inside Flow Finder so every other
// ticket list in the app keeps its original row layout untouched.
function flowTicketRow(tid){
  const owner = currentOwner(tid);
  const title = ticketTitle(tid);
  const od = overdueInfo(tid);
  return `
