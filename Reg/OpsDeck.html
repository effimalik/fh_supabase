}
function renderFlowFinder(u){
  const scoped = isManager(u.id) && u.dept;
  let matches = [];

  if(state.ffMode==='ticket'){
    matches = allTicketIds().filter(tid=>{
      if(scoped && !ticketTouchesDept(tid, u.dept)) return false;
      if(!state.ffQuery) return true;
      const q = state.ffQuery.toLowerCase();
      if(String(tid).toLowerCase().includes(q)) return true;
      if(ticketTitle(tid).toLowerCase().includes(q)) return true;
      const m = master(tid);
      if(m && m.subjectId && m.subjectId.toLowerCase().includes(q)) return true;
      return ticketEvents(tid).some(e=>
        nameOf(e.to).toLowerCase().includes(q) || nameOf(e.performedBy).toLowerCase().includes(q)
      );
    });
  } else if(state.ffMode==='subjectEmployee'){
    matches = state.ffQuery ? allTicketIds().filter(tid=>{
      const m = master(tid); return m && m.subjectId===state.ffQuery;
    }) : [];
  } else if(state.ffMode==='handler'){
    matches = state.ffMulti.length ? allTicketIds().filter(tid=>{
      return ticketEvents(tid).some(e=> state.ffMulti.includes(e.performedBy) || state.ffMulti.includes(e.to));
    }) : [];
  } else if(state.ffMode==='department'){
    // Every user with a home department is scoped to it here — not just
    // managers — so "Department" always opens straight onto every ticket
    // that has touched their own department. Only users without a
    // department (e.g. GM) get the picker, and even then it's one
    // department at a time.
    const targetDeptIds = u.dept ? [u.dept] : state.ffMulti;
    matches = targetDeptIds.length ? allTicketIds().filter(tid=> targetDeptIds.some(id=>ticketTouchesDept(tid, id))) : [];
  } else if(state.ffMode==='status'){
    // Shows every (in-scope) ticket until a status is picked, then narrows.
    matches = allTicketIds().filter(tid=>{
      if(scoped && !ticketTouchesDept(tid, u.dept)) return false;
      if(!state.ffQuery) return true;
      return currentOwner(tid).status===state.ffQuery;
    });
  }

  // Date range used to be its own mode ("Date range") that replaced whatever
  // other filter was active. It's now a standing refinement — available
  // under every category at once instead of a separate subtab item — so it
  // runs here, after the mode-specific matches, on top of whichever
  // category produced them.
  if(state.ffFrom || state.ffTo){
    const fromMs = state.ffFrom ? new Date(state.ffFrom+'T00:00:00').getTime() : null;
    const toMs = state.ffTo ? new Date(state.ffTo+'T23:59:59').getTime() : null;
    matches = matches.filter(tid=>{
      const created = ticketEvents(tid)[0];
      if(!created) return false;
      if(fromMs && created.eventId < fromMs) return false;
      if(toMs && created.eventId > toMs) return false;
      return true;
    });
  }

  const sortedMatches = matches.slice().sort((a,b)=> ticketNumOf(b) - ticketNumOf(a));
  const resultsHtml = sortedMatches.length ? sortedMatches.map(t=>flowTicketRow(t)).join('') :
    `<div class="empty"><b>No matches.</b>Try a different search.</div>`;

  // Same source as the "+" New Ticket window's dropdowns (activeDeptOptions
  // / activePersonOptions, the active Users cache) — not just whoever
  // happens to already appear in the ticket log.
  const handlerOptions = activePersonOptions().filter(p => !u.dept || (dept(u.dept) && p.deptName && p.deptName.toLowerCase()===dept(u.dept).name.toLowerCase()));
  const departmentOptions = activeDeptOptions();

  let queryControl;
  if(state.ffMode==='ticket'){
    queryControl = `<input type="text" id="ffQuery" placeholder="Search by ticket #, title, or Subject Employee (E-code)…" value="${state.ffQuery.replace(/"/g,'&quot;')}">`;
  } else if(state.ffMode==='subjectEmployee'){
    // Sourced from the ap2_employee cache (same roster + same search-box
    // pattern as the New Ticket "+" drawer's Subject Employee field),
    // instead of only whatever E-codes already happen to appear in tickets.
    queryControl = `<div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;">
      ${ffSubjDropShell()}
      <span class="cache-ping ${EMPLOYEE_CACHE_OK?'ok':'warn'}" title="${EMPLOYEE_CACHE_OK?'Employee roster loaded from ap2_employee cache':'ap2_employee cache unavailable — no employee roster loaded'}" style="flex-shrink:0;margin-left:0;margin-right:10px;"></span>
    </div>`;
  } else if(state.ffMode==='handler'){
    const opts = handlerOptions.map(p=>({value:p.email, label:p.name, sub:p.email}));
    queryControl = `<div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;">
      <div style="flex:1;min-width:0;">${renderMultiSelect('ffHandlerMsel', opts, state.ffMulti, {
        single:true,
        placeholder: opts.length ? 'Select a handler…' : (USERS_READY ? (u.dept ? 'No handlers in your department yet' : 'No handlers yet') : 'Loading Users cache…'),
        searchPlaceholder:'Search by name or email…'
      })}</div>
      <span class="cache-ping ${USERS_READY?'ok':'warn'}" title="${USERS_READY?'Handler list loaded from Users cache':'Users cache unavailable — no handlers loaded yet'}" style="flex-shrink:0;margin-right:10px;"></span>
    </div>`;
  } else if(state.ffMode==='department'){
    queryControl = u.dept
      ? `<div class="hint">Showing every ticket for ${dept(u.dept).name} — your department.</div>`
      : `<div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px;">
          <div style="flex:1;min-width:0;">${renderMultiSelect('ffDeptMsel', departmentOptions.map(d=>({value:d.name, label:d.name})), state.ffMulti, {
            single:true,
            placeholder: departmentOptions.length ? 'Select a department…' : (USERS_READY ? 'No departments yet' : 'Loading Users cache…'),
            searchPlaceholder:'Search departments…'
          })}</div>
          <span class="cache-ping ${USERS_READY?'ok':'warn'}" title="${USERS_READY?'Department list loaded from Users cache':'Users cache unavailable — no departments loaded yet'}" style="flex-shrink:0;margin-right:10px;"></span>
        </div>`;
  } else if(state.ffMode==='status'){
    queryControl = `<select id="ffQuery">
      <option value="">All statuses</option>
      ${TICKET_STATUSES.map(v=>`<option value="${v}" ${state.ffQuery===v?'selected':''}>${statusDisplayLabel(v)}</option>`).join('')}
    </select>`;
  }

  return `
  ${!SUBJECT_EMPLOYEE_COLUMN_SEEN ? `<div class="empty" style="text-align:left;padding:12px 14px;margin-bottom:14px;border-color:var(--amber-dim);">
    <b style="color:var(--amber);font-size:13px;">No Subject Employee (E2) values found yet.</b>
    The connected ticLog master rows have a Subject_ID column, but nothing in it is filled in yet — searches by Subject Employee won't return anything until a ticket carries one.
  </div>` : ''}
  <div class="ff-header-row">
    <h1 class="page-title">Flow Finder</h1>
    <div class="ff-filters-col">
      <div class="ff-caption">
        <span class="ff-cap-icon">${FF_CAT_ICONS[state.ffMode]||''}</span>
        Searching by <strong>${escHtml(ffCategoryLabel(state.ffMode))}</strong>${(state.ffFrom||state.ffTo) ? ` <span class="ff-cap-dates">· ${escHtml(state.ffFrom||'any date')} → ${escHtml(state.ffTo||'any date')}</span>` : ''}
      </div>
      <div class="ff-toolbar">
        <div class="ff-toolbar-scroll">
          <div class="ff-searchbox">
            ${renderFfCategorySelect()}
            <span class="ff-box-divider"></span>
            <div class="ff-query-wrap">${queryControl}</div>
          </div>
          ${renderFfDateFilter()}
        </div>
      </div>
    </div>
  </div>
  ${state.ffSelectedTicket ? renderTimelineView(state.ffSelectedTicket, u) : `<div class="ff-results">${resultsHtml}</div>`}
  `;
}

/* ═══════════ Flow Finder "Subject Employee" search dropdown ═══════════
   Same plain search-box + highlighted list pattern as the New Ticket "+"
   drawer's Subject Employee field (empSearchDropShell et al.), pulling
   from the same ap2_employee cache (EMPLOYEES) — kept as its own set of
   functions/DOM ids so the New Ticket drawer code above is untouched. */
function ffSubjSelectedLabel(){
  const id = state.ffQuery;
  if(!id) return '';
  const e = EMPLOYEES.find(x=>String(x.id)===String(id));
  return e ? employeeLabel(e) : id;
}
function ffSubjDropShell(){
  return `
  <div class="emp-drop" id="ffSubjectDrop">
    <input type="text" class="emp-drop-input" id="ffSubjectInput" autocomplete="off"
      placeholder="${EMPLOYEES.length?'Search by ID or name…':'No employees in cache'}"
      value="${escAttr(ffSubjSelectedLabel())}">
    <div class="dropdown-list" id="ffSubjectList"></div>
  </div>`;
}
function filterFfSubjDrop(q){
  const list = document.getElementById('ffSubjectList');
  if(!list) return;
  const lq = q.toLowerCase().trim();
  const hits = (lq ? EMPLOYEES.filter(e=>String(e.id).toLowerCase().includes(lq)||e.name.toLowerCase().includes(lq)) : EMPLOYEES).slice(0,15);
  const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hl = v=>{
    const safe = escHtml(v);
    return lq ? safe.replace(new RegExp(`(${escRe(lq)})`,'gi'),'<em>$1</em>') : safe;
  };
  let html;
  if(!EMPLOYEES.length){
    html = `<div class="di no-match">No employees in cache</div>`;
  }else if(!hits.length){
    html = `<div class="di no-match">No employees found</div>`;
  }else{
    html = hits.map(e=>`<div class="di" data-ff-emp-id="${escAttr(e.id)}">
        <div class="dn">${hl(e.name)}</div>
        <div class="ds">ID: ${hl(String(e.id))}</div>
      </div>`).join('');
  }
  list.innerHTML = html;
  list.classList.add('open');
  const wrap = document.getElementById('ffSubjectDrop'); if(wrap) wrap.classList.add('open');
}
function openFfSubjDrop(){
  const input = document.getElementById('ffSubjectInput');
  filterFfSubjDrop(input ? input.value : '');
}
function closeFfSubjDrop(){
  const list = document.getElementById('ffSubjectList'); if(list) list.classList.remove('open');
  const wrap = document.getElementById('ffSubjectDrop'); if(wrap) wrap.classList.remove('open');
}
function selectFfSubjDrop(id){
  state.ffQuery = String(id);
  closeFfSubjDrop();
  render();
}

function kindOfAction(action){
  if(action==='CREATED') return 'created';
  if(action==='TRANSFERRED' || action==='ASSIGNED') return 'forward';
  if(action==='ACCEPTED') return 'accept';
  if(action==='ON_HOLD') return 'hold';
  if(action==='RESUMED') return 'resume';
  if(action==='COMMENT') return 'comment';
  if(action==='REMINDER' || action==='REMINDER_ALERT') return 'reminder';
  if(action==='REMINDER_ATTENDED') return 'result';
  if(action==='RESOLVED') return 'resolved';
  return 'forward';
}
function kindIcon(k){
  return {created:'◆', forward:'→', accept:'✓', hold:'⏸', resume:'▶', comment:'💬', reminder:'⏰', result:'↩', resolved:'✓'}[k] || '•';
}

function renderTimelineView(tid, u){
  const rows = ticketTimeline(tid);
  const m = master(tid);
  const owner = currentOwner(tid);
  let items = '';
  rows.forEach((r,i)=>{
    const k = kindOfAction(r.action);
    const gap = i>0 ? fmtDur(r.eventId - rows[i-1].eventId) : null;
    const whoLine = `${nameOf(r.performedBy)}${r.to && r.to!==r.performedBy ? ` → ${nameOf(r.to)}` : ''}`;
    items += `
    <div class="tl-item k-${k}">
      ${gap ? `<div class="tl-gap">+${gap}</div>` : ''}
      <div class="tl-dot">${kindIcon(k)}</div>
      <div class="tl-card">
        <div class="tl-head">
          <span class="tl-action">${actionLabel(r.action)}</span>
          <span class="tl-ts">${fmtTs(r.eventId)}</span>
        </div>
        <div class="tl-who">${whoLine} · <span class="status-chip ${statusClass(r.status)}" style="padding:1px 7px;font-size:10px;">${statusDisplayLabel(r.status)}</span></div>
        ${r.detail ? `<div class="tl-notes">${escHtml(r.detail)}</div>` : ''}
      </div>
    </div>`;
  });
  const backLabel = state.ffReturnView ? `← Back to ${viewLabel(state.ffReturnView)}` : '← Back to results';
  return `
  <button class="btn btn-ghost btn-sm" id="ffBack" title="${escAttr(backLabel)}">${ICON_BACK}<span class="btn-label">${backLabel}</span></button>
  <div class="card" style="margin-top:12px;">
    <div class="kicker">Ticket #${tid}</div>
    <h2 style="font-family:var(--font-display);margin:0 0 4px;">${escHtml(ticketTitle(tid))}</h2>
    <p class="page-sub" style="margin-bottom:2px;">
      <b style="color:var(--text-dim);">Subject Employee (E2):</b> ${owner.subjectId ? nameOf(owner.subjectId) : '<span style="color:var(--red);">not recorded</span>'}
      &nbsp;·&nbsp; Requester: ${owner.createdBy ? nameOf(owner.createdBy) : '—'}
      &nbsp;·&nbsp; Priority: ${owner.priority}
    </p>
    <p class="page-sub" style="margin-bottom:0;">Full timeline, oldest to newest.</p>
    <div class="tl-wrap"><div class="timeline">${items}</div></div>
  </div>
  ${renderRespondPanel(tid, u)}
  `;
}

/* ═══════════ Respond panel — permission gate covers every real action:
   Accept (from a dept queue or a direct hand-off), Comment, Hold/Resume,
   Set/Attend Reminder, Transfer (to dept or delegate to a person),
   Resolve. */
function respondPermission(tid, u){
  const owner = currentOwner(tid);
  if(!owner) return {mode:'none'};
  if(isTerminal(owner.status)) return {mode:'none'};
  if(isGM(u.id)) return {mode:'none'}; // GM: read-only oversight
  if(owner.status==='NEW'){
    if(owner.createdBy===u.id) return {mode:'none'}; // creator can't accept their own ticket
    const target = owner.assignedTo;
    if(isDeptToken(target)){
      const td = deptByName(target);
      if(isManager(u.id) && u.dept && td && td.id===u.dept) return {mode:'accept-dept'};
      if(!isManager(u.id) && u.dept && td && td.id===u.dept) return {mode:'accept-dept'};
      return {mode:'none'};
    }
    if(target===u.id) return {mode:'accept-direct'};
    return {mode:'none'};
  }
  if(owner.assignedTo===u.id){
    return {mode:'full', ticketStatus:owner.status};
  }
  const ownerStaff = staff(owner.assignedTo);
  if(isManager(u.id) && u.dept && ownerStaff && ownerStaff.dept===u.dept){
    return {mode:'oversee'};
  }
  return {mode:'none'};
}

function renderRespondPanel(tid, u){
  const perm = respondPermission(tid, u);
  const owner = currentOwner(tid);
  if(perm.mode==='none') return '';
  if(perm.mode==='accept-dept' || perm.mode==='accept-direct'){
    return `
    <div class="card" style="margin-top:14px;">
      <div class="section-label" style="margin-top:0;">New ticket — accept it?</div>
      <p class="hint" style="margin-bottom:10px;">${perm.mode==='accept-dept' ? `Unclaimed in ${nameOf(owner.assignedTo)}. Any member of that department can accept it.` : `Directly transferred to you. Accept it to start working, or hand it off again.`}</p>
      <div class="btn-row">
        <button class="btn btn-primary btn-sm" data-respond="accept" data-tid="${tid}" title="Accept">${ICON_ACCEPT}<span class="btn-label">Accept</span></button>
      </div>
    </div>`;
  }
  if(perm.mode==='oversee'){
    return `
    <div class="card" style="margin-top:14px;">
      <div class="section-label" style="margin-top:0;">Manager oversight</div>
      <p class="hint" style="margin-bottom:10px;">Currently with ${nameOf(owner.assignedTo)}. You can transfer it within ${u.dept ? dept(u.dept).name : 'your team'}.</p>
      <div class="btn-row">
        <button class="btn btn-sm" data-respond="delegate" data-tid="${tid}" title="Reassign">${ICON_REASSIGN}<span class="btn-label">Reassign</span></button>
      </div>
    </div>`;
  }
  // full: owner === current actor
  return `
  <div class="card" style="margin-top:14px;">
    <div class="section-label" style="margin-top:0;">Respond to this ticket</div>
    <div class="btn-row">
      ${owner.status==='ON HOLD' ? `<button class="btn btn-primary btn-sm" data-respond="resume" data-tid="${tid}" title="Resume">${ICON_PLAY}<span class="btn-label">Resume</span></button>` : ''}
      <button class="btn btn-amber btn-sm" data-respond="reminder" data-tid="${tid}" title="Set reminder">${ICON_ALARM}<span class="btn-label">Set reminder</span></button>
      ${overdueInfo(tid).overdue ? `<button class="btn btn-sm" data-respond="attend" data-tid="${tid}" title="Attend reminder">${ICON_ATTEND}<span class="btn-label">Attend reminder</span></button>` : ''}
      <button class="btn btn-sm" data-respond="delegate" data-tid="${tid}" title="Delegate">${ICON_DELEGATE}<span class="btn-label">Delegate</span></button>
      <button class="btn btn-primary btn-sm" data-respond="resolve" data-tid="${tid}" title="Done">${ICON_DONE}<span class="btn-label">Done</span></button>
    </div>
  </div>`;
}

// ----- Org Overview (GM) -----
function renderOrgOverview(u){
  return renderOrgReports(u);
}

/* ═══════════ Reports (Org Overview → Reports) ═══════════
   Department-wise / case-wise (ticket-wise) / role-wise ("objective-wise" —
   there's no Objective field in the real data, so this groups by the
   currently-assigned person's role: Worker/Manager/GM or their real title
   from the Users cache) / employee-wise breakdowns, each filterable by
   date-created range, person, and department, with a Table (full data) and
   a Dashboard (visual) view mode, per the requirement doc. */
const REPORT_GROUPS = [
  {key:'case', label:'Case-wise', icon:ICON_TICKET},
  {key:'dept', label:'Department-wise', icon:ICON_DEPARTMENT},
  {key:'role', label:'Role-wise (Objective)', icon:ICON_CAT_ROLE},
  {key:'employee', label:'Employee-wise', icon:ICON_PERSON},
];
// A ticket's creation timestamp — the earliest event row's eventId, which
// doubles as epoch ms per the app's own Event_ID convention.
function ticketCreatedMs(tid){
  const evs = ticketEvents(tid);
  return evs.length ? evs[0].eventId : null;
}
// "YYYY-MM-DD" (native date input) -> epoch ms, in UAE wall-clock time,
// either the start or end of that day.
function parseDateInputToMs(str, endOfDay){
  if(!str) return null;
  const [y,mo,da] = str.split('-').map(Number);
  if(!y || !mo || !da) return null;
  return endOfDay ? dubaiToMs(y, mo-1, da, 23,59,59) : dubaiToMs(y, mo-1, da, 0,0,0);
}
// Real title from the Users cache if known ("Officer", "Manager", "GM"...);
// otherwise falls back to the discovered STAFF tier (Worker/Manager/GM) —
// this is the only "role" concept the real data actually carries.
function personRoleLabel(id){
  const u = userFor(id);
  if(u && u.roleTitle) return u.roleTitle;
  const s = staff(id);
  if(s) return s.role==='gm' ? 'General Manager' : s.role==='manager' ? 'Manager' : 'Worker';
  return 'Unknown';
}
// Role-wise grouping key for a ticket: the role of whoever currently holds
// it, or "Unassigned (queued)" while it's still sitting in a department
// queue rather than with a named person.
function ticketRoleGroup(tid){
  const o = currentOwner(tid);
  if(!o) return 'Unknown';
  if(!isPersonCode(o.assignedTo)) return 'Unassigned (queued)';
  return personRoleLabel(o.assignedTo);
}
function reportMatchesFilters(tid){
  const o = currentOwner(tid);
  if(!o) return false;
  const fromMs = parseDateInputToMs(state.reportFrom, false);
  const toMs = parseDateInputToMs(state.reportTo, true);
  if(fromMs!=null || toMs!=null){
    const created = ticketCreatedMs(tid);
    if(created==null) return false;
    if(fromMs!=null && created<fromMs) return false;
    if(toMs!=null && created>toMs) return false;
  }
  if(state.reportPerson!=='all' && o.assignedTo!==state.reportPerson) return false;
  if(state.reportDept!=='all' && deptNameOfTarget(o.assignedTo)!==state.reportDept) return false;
  return true;
}
function reportFilteredTickets(){ return allTicketIds().filter(reportMatchesFilters); }
// Raw list of creation→resolution durations (ms) for whichever of the
// given tickets are already terminal. Shared by every resolution-time
// stat below so avg/median/p90 always agree on which tickets counted.
// currentOwner(tid)'s own eventId already IS the resolving event's
// timestamp once the ticket is terminal, so no extra event lookup is needed.
function resolutionDurations(tids){
  return tids.map(tid=>{
    const o = currentOwner(tid);
    if(!o || !isTerminal(o.status)) return null;
    const created = ticketCreatedMs(tid);
    if(created==null) return null;
    return o.eventId - created;
  }).filter(v=>v!=null && v>=0);
}
// Mean resolution time — null when no ticket in the set is terminal yet
// (so callers can show "—" instead of a misleading 0).
function avgResolutionMs(tids){
  const durations = resolutionDurations(tids);
  if(!durations.length) return null;
  return durations.reduce((a,b)=>a+b, 0) / durations.length;
}
// Median resolution time — a single slow outlier (e.g. one ticket left
// open for weeks) drags the average up but barely moves the median, so
// showing both next to each other exposes that kind of skew at a glance.
function medianResolutionMs(tids){
  const durations = resolutionDurations(tids).slice().sort((a,b)=>a-b);
  if(!durations.length) return null;
  const mid = Math.floor(durations.length/2);
  return durations.length%2 ? durations[mid] : (durations[mid-1]+durations[mid])/2;
}
// Daily creation-volume trend for the last `days` calendar days (UAE wall
// clock), oldest first — a simple count per day, independent of the
// Pending/Done split the other charts use.
function ticketsCreatedByDay(tids, days){
  const now = nowMs();
  const buckets = [];
  for(let i=days-1;i>=0;i--){
    const p = dubaiParts(now - i*86400000);
    buckets.push({label:`${pad(p.month+1)}-${pad(p.day)}`, y:p.year, mo:p.month, da:p.day, count:0});
  }
  tids.forEach(tid=>{
    const created = ticketCreatedMs(tid);
    if(created==null) return;
    const p = dubaiParts(created);
    const b = buckets.find(x=>x.y===p.year && x.mo===p.month && x.da===p.day);
    if(b) b.count++;
  });
  return buckets;
}
// Daily resolution-volume trend (mirrors ticketsCreatedByDay): counts a
// ticket on the day its current owner row went terminal. Only tickets
// that are actually RESOLVED/CLOSED show up here, so this is strictly a
// "work completed" series, independent of the Pending/Done split.
function ticketsResolvedByDay(tids, days){
  const now = nowMs();
  const buckets = [];
  for(let i=days-1;i>=0;i--){
    const p = dubaiParts(now - i*86400000);
    buckets.push({label:`${pad(p.month+1)}-${pad(p.day)}`, y:p.year, mo:p.month, da:p.day, count:0});
  }
  tids.forEach(tid=>{
    const o = currentOwner(tid);
    if(!o || !isTerminal(o.status)) return;
    const p = dubaiParts(o.eventId);
    const b = buckets.find(x=>x.y===p.year && x.mo===p.month && x.da===p.day);
    if(b) b.count++;
  });
  return buckets;
}
// Two-series (created vs resolved) daily bars — one compact row per day,
// each with a stacked pair of mini-tracks — shows whether the team is
// keeping pace with incoming volume or losing ground, which a single
// creation-count trend can't reveal on its own.
function renderTrendBars(createdBuckets, resolvedBuckets){
  if(!createdBuckets.length) return `<div class="empty">No data for this range.</div>`;
  const max = Math.max(1, ...createdBuckets.map(b=>b.count), ...resolvedBuckets.map(b=>b.count));
  return `<div class="bar-chart">
    ${createdBuckets.map((b,i)=>{
      const r = resolvedBuckets[i] || {count:0};
      return `
      <div class="bar-row">
        <div class="bar-label">${escHtml(b.label)}</div>
        <div class="bar-track-dual">
          <div class="bar-track"><div class="bar-seg created" style="width:${(b.count/max*100).toFixed(2)}%"></div></div>
          <div class="bar-track"><div class="bar-seg resolved" style="width:${(r.count/max*100).toFixed(2)}%"></div></div>
        </div>
        <div class="bar-nums">${b.count} in · ${r.count} out</div>
      </div>`;
    }).join('')}
  </div>
  <div class="legend"><span class="lg-dot created"></span>Created<span class="lg-dot resolved"></span>Resolved</div>`;
}
// Buckets a ticket-id list by keyFn into {label, tids, total, pending, done},
// sorted by volume — the shared shape both the bar charts and the grouped
// table breakdowns are built from.
function groupTickets(tids, keyFn){
  const map = new Map();
  tids.forEach(tid=>{
    const key = keyFn(tid) || 'Unknown';
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(tid);
  });
  return [...map.entries()].map(([label, list])=>{
    const pending = list.filter(t=> !isTerminal(currentOwner(t).status)).length;
    return {label, tids:list, total:list.length, pending, done:list.length-pending};
  }).sort((a,b)=> b.total-a.total);
}
// Org-wide (unfiltered) pulse for the last N vs. the previous N days —
// used only for the small trend badges under the KPI cards. Deliberately
// independent of the report's own date/person/department filters, the
// same way a heartbeat readout wouldn't change just because you scrolled
// a table beneath it; it always answers "how is the org trending right now".
function orgPulse(days){
  const now = nowMs();
  const all = allTicketIds();
  const inWindow = (ms, from, to) => ms!=null && ms>=from && ms<to;
  let createdThis=0, createdPrev=0, resolvedThis=0, resolvedPrev=0;
  all.forEach(tid=>{
    const created = ticketCreatedMs(tid);
    if(inWindow(created, now-days*86400000, now)) createdThis++;
    else if(inWindow(created, now-2*days*86400000, now-days*86400000)) createdPrev++;
    const o = currentOwner(tid);
    if(o && isTerminal(o.status)){
      if(inWindow(o.eventId, now-days*86400000, now)) resolvedThis++;
      else if(inWindow(o.eventId, now-2*days*86400000, now-days*86400000)) resolvedPrev++;
    }
  });
  return {createdThis, createdPrev, resolvedThis, resolvedPrev};
}
// Renders a small "▲/▼ N% vs prior Nd" line. `goodWhenUp=false` flips the
// color so that, e.g., a rising overdue count reads as red even though
// the number itself went up.
function deltaBadge(curr, prev, days, goodWhenUp){
  if(prev===0 && curr===0) return `<div class="kpi-delta flat">— flat vs prior ${days}d</div>`;
  if(prev===0) return `<div class="kpi-delta up">▲ new activity vs prior ${days}d</div>`;
  const pct = Math.round((curr-prev)/prev*100);
  const cls = pct===0 ? 'flat' : ((pct>0)===goodWhenUp ? 'up' : 'down');
  const arrow = pct===0 ? '—' : (pct>0?'▲':'▼');
  return `<div class="kpi-delta ${cls}">${arrow} ${Math.abs(pct)}% vs prior ${days}d</div>`;
}
function renderKpiCards(tids){
  const total = tids.length;
  const pending = tids.filter(t=> !isTerminal(currentOwner(t).status)).length;
  const done = total-pending;
  const pct = total ? Math.round(done/total*100) : 0;
  const overdueCt = tids.filter(t=>overdueInfo(t).overdue).length;
  const overduePct = pending ? Math.round(overdueCt/pending*100) : 0;
  const avgMs = avgResolutionMs(tids);
  const medianMs = medianResolutionMs(tids);
  const pulseDays = 7;
  const pulse = orgPulse(pulseDays);
  const netBacklog = pulse.createdThis - pulse.resolvedThis;
  // Average vs. median as a plain-language skew note: when the mean sits
  // well above the median, a handful of slow tickets are pulling the
  // headline average up — worth flagging since the average alone would
  // otherwise read as "typical".
  const skewNote = (avgMs!=null && medianMs!=null && medianMs>0 && avgMs > medianMs*1.4)
    ? `<div class="kpi-delta down">▲ skewed by slow outliers</div>` : '';
  return `<div class="kpi-grid">
    <div class="kpi-card kpi-total"><div><div class="kpi-n">${total}</div><div class="kpi-l">Total tickets</div>${deltaBadge(pulse.createdThis, pulse.createdPrev, pulseDays, false)}</div><div class="kpi-icon">${ICON_TICKET}</div></div>
    <div class="kpi-card kpi-pending"><div><div class="kpi-n">${pending}</div><div class="kpi-l">Pending</div><div class="kpi-delta ${netBacklog>0?'down':netBacklog<0?'up':'flat'}">${netBacklog>0?'▲':netBacklog<0?'▼':'—'} ${netBacklog>0?'+':''}${netBacklog} net this wk</div></div><div class="kpi-icon">${ICON_ALARM}</div></div>
    <div class="kpi-card kpi-done"><div><div class="kpi-n">${done}</div><div class="kpi-l">Done</div>${deltaBadge(pulse.resolvedThis, pulse.resolvedPrev, pulseDays, true)}</div><div class="kpi-icon">${ICON_CHECK}</div></div>
    <div class="kpi-card kpi-rate"><div><div class="kpi-n">${pct}%</div><div class="kpi-l">Completion rate</div></div><div class="kpi-icon">${ICON_TARGET}</div></div>
    <div class="kpi-card kpi-overdue"><div><div class="kpi-n">${overdueCt}</div><div class="kpi-l">Overdue</div><div class="kpi-delta ${overduePct>0?'down':'flat'}">${overduePct}% of pending</div></div><div class="kpi-icon">${ICON_ALARM}</div></div>
    <div class="kpi-card kpi-avgtime"><div><div class="kpi-n">${avgMs!=null?fmtDur(avgMs):'—'}</div><div class="kpi-l">Avg. resolution</div>${skewNote}</div><div class="kpi-icon">${ICON_CHART}</div></div>
    <div class="kpi-card kpi-median"><div><div class="kpi-n">${medianMs!=null?fmtDur(medianMs):'—'}</div><div class="kpi-l">Median resolution</div></div><div class="kpi-icon">${ICON_CHART}</div></div>
  </div>`;
}
// Stacked Pending/Done bar per group — this is the "Pending vs. Done
// graph, filterable by date, person, department" from the requirement doc.
function renderPendingDoneBars(groups){
  if(!groups.length) return `<div class="empty">No tickets match these filters.</div>`;
  const max = Math.max(1, ...groups.map(g=>g.total));
  return `<div class="bar-chart">
    ${groups.map(g=>`
      <div class="bar-row">
        <div class="bar-label" title="${escAttr(g.label)}">${escHtml(g.label)}</div>
        <div class="bar-track">
          <div class="bar-seg pending" style="width:${(g.pending/max*100).toFixed(2)}%"></div>
          <div class="bar-seg done" style="width:${(g.done/max*100).toFixed(2)}%"></div>
        </div>
        <div class="bar-nums">${g.pending} pending · ${g.done} done · ${g.total?Math.round(g.done/g.total*100):0}%</div>
      </div>`).join('')}
  </div>
  <div class="legend"><span class="lg-dot pending"></span>Pending<span class="lg-dot done"></span>Done</div>`;
}
// Average resolution time per group (e.g. department) — only groups that
// have at least one terminal ticket are included, so a department with an
// all-pending queue doesn't show a misleading "0" bar. Sorted slowest
// first, since that's what an ops lead needs to see first.
function avgResolutionByGroup(tids, keyFn){
  const map = new Map();
  tids.forEach(tid=>{
    const key = keyFn(tid) || 'Unknown';
    if(!map.has(key)) map.set(key, []);
    map.get(key).push(tid);
  });
  return [...map.entries()]
    .map(([label, list])=>({label, ms: avgResolutionMs(list), count: list.length}))
    .filter(g=> g.ms!=null)
    .sort((a,b)=> b.ms-a.ms);
}
// Single-series bars whose value is a duration (ms) rather than a count —
// used for "avg. resolution time by department". Renders fmtDur() instead
// of a raw number.
function renderDurationBars(items){
  if(!items.length) return `<div class="empty">No resolved tickets in this range yet.</div>`;
  const max = Math.max(1, ...items.map(i=>i.ms));
  return `<div class="bar-chart">
    ${items.map(i=>`
      <div class="bar-row">
        <div class="bar-label" title="${escAttr(i.label)}">${escHtml(i.label)}</div>
        <div class="bar-track"><div class="bar-seg done" style="width:${(i.ms/max*100).toFixed(2)}%"></div></div>
        <div class="bar-nums">${fmtDur(i.ms)} avg · ${i.count} resolved</div>
      </div>`).join('')}
  </div>`;
}
// Ages every currently-pending ticket (from creation to now) into
// standard backlog-aging buckets. Tickets sitting 7+ days without
// resolution are the ones most likely to need management attention, so
// this is deliberately separate from the raw Pending count on the KPI row.
const BACKLOG_AGE_BUCKETS = [
  {label:'0–1 day', max:86400000, cls:'age-fresh'},
  {label:'1–3 days', max:3*86400000, cls:'age-fresh'},
  {label:'3–7 days', max:7*86400000, cls:'age-warn'},
  {label:'7+ days', max:Infinity, cls:'age-stale'},
];
function backlogAgeBuckets(tids){
  const now = nowMs();
  const buckets = BACKLOG_AGE_BUCKETS.map(b=>({...b, count:0}));
  tids.forEach(tid=>{
    const o = currentOwner(tid);
    if(!o || isTerminal(o.status)) return;
    const created = ticketCreatedMs(tid);
    if(created==null) return;
    const age = now - created;
    const b = buckets.find(x=> age <= x.max) || buckets[buckets.length-1];
    b.count++;
  });
  return buckets;
}
// Backlog-age bars — severity-colored (fresh/warn/stale) rather than a
// single flat color, so the oldest bucket visually stands out as risk.
function renderAgeBars(buckets){
  const total = buckets.reduce((s,b)=>s+b.count, 0);
  if(!total) return `<div class="empty">No open tickets in this range.</div>`;
  const max = Math.max(1, ...buckets.map(b=>b.count));
  return `<div class="bar-chart">
    ${buckets.map(b=>`
      <div class="bar-row">
        <div class="bar-label">${escHtml(b.label)}</div>
        <div class="bar-track"><div class="bar-seg ${b.cls}" style="width:${(b.count/max*100).toFixed(2)}%"></div></div>
        <div class="bar-nums">${b.count}</div>
      </div>`).join('')}
  </div>
  <div class="legend"><span class="lg-dot age-fresh"></span>Under 3 days<span class="lg-dot age-warn"></span>3–7 days<span class="lg-dot age-stale"></span>Over 7 days</div>`;
}
// Flat, full-data ticket table — the "case-wise" report, and also what
// every grouped report's expandable detail drills into. Rows reuse the
// existing [data-open-ticket] wiring, so clicking one opens Flow Finder.
function renderTicketTable(tids){
  if(!tids.length) return `<div class="empty">No tickets match these filters.</div>`;
  const rows = tids.slice().sort((a,b)=> currentOwner(b).eventId-currentOwner(a).eventId);
  return `<div class="rep-table-wrap"><table class="rep-table">
    <thead><tr><th>Ticket</th><th>Subject</th><th>Department</th><th>Assigned to</th><th>Role</th><th>Priority</th><th>Status</th><th>Created</th></tr></thead>
    <tbody>
    ${rows.map(tid=>{
      const o = currentOwner(tid);
      const created = ticketCreatedMs(tid);
      return `<tr data-open-ticket="${escAttr(tid)}">
        <td class="mono">${escHtml(tid)}</td>
        <td>${escHtml(ticketTitle(tid))}</td>
        <td>${escHtml(deptNameOfTarget(o.assignedTo))}</td>
        <td>${escHtml(nameOf(o.assignedTo))}</td>
        <td>${escHtml(ticketRoleGroup(tid))}</td>
        <td>${escHtml(o.priority)}</td>
        <td><span class="status-chip ${statusClass(o.status)}">${escHtml(statusDisplayLabel(o.status))}</span></td>
        <td class="mono">${created!=null ? fmtTs(created) : '—'}</td>
      </tr>`;
    }).join('')}
    </tbody>
  </table></div>`;
}
// Grouped report (department-wise / role-wise / employee-wise): a summary
// row per group plus a collapsible full ticket table underneath it.
function renderGroupedReport(groups, groupLabel){
  if(!groups.length) return `<div class="empty">No tickets match these filters.</div>`;
  return `<div class="rep-table-wrap"><table class="rep-table rep-table-summary">
    <thead><tr><th>${escHtml(groupLabel)}</th><th>Total</th><th>Pending</th><th>Done</th><th>Completion</th></tr></thead>
    <tbody>
    ${groups.map(g=>{
      const pct = g.total ? Math.round(g.done/g.total*100) : 0;
      return `<tr><td>${escHtml(g.label)}</td><td>${g.total}</td><td style="color:var(--amber);">${g.pending}</td><td style="color:var(--teal);">${g.done}</td><td>${pct}%</td></tr>`;
    }).join('')}

  ${groups.map(g=>`

}
// Severity order (highest risk first) for every priority-grouped chart
// below — sorted this way rather than by volume/duration so a GM can
// always scan top-to-bottom by urgency.
const PRIORITY_ORDER = ['Critical','High','Medium','Low'];
// Pending vs. overdue split per priority level — the "risk" view the
// plain Pending/Done-by-priority chart can't show, since a priority can
// be mostly caught up in volume while still missing its own deadlines.
function overdueRiskByPriority(tids){
  return PRIORITY_ORDER.map(p=>{
    const inGroup = tids.filter(t=>currentOwner(t).priority===p);
    const pendingList = inGroup.filter(t=>!isTerminal(currentOwner(t).status));
    const overdueList = pendingList.filter(t=>overdueInfo(t).overdue);
    return {label:p, pending:pendingList.length, overdue:overdueList.length};
  }).filter(g=>g.pending>0);
}
// Overdue-count bars, severity-colored the same as the backlog-age chart
// (on-track = amber "pending" segment, overdue = red "age-stale" segment)
// so the two risk charts read consistently.
function renderOverdueRiskBars(items){
  if(!items.length) return `<div class="empty">No pending tickets in this range.</div>`;
  const max = Math.max(1, ...items.map(i=>i.pending));
  return `<div class="bar-chart">
    ${items.map(i=>{
      const pct = i.pending ? Math.round(i.overdue/i.pending*100) : 0;
      return `
      <div class="bar-row">
        <div class="bar-label">${escHtml(i.label)}</div>
        <div class="bar-track">
          <div class="bar-seg pending" style="width:${((i.pending-i.overdue)/max*100).toFixed(2)}%"></div>
          <div class="bar-seg age-stale" style="width:${(i.overdue/max*100).toFixed(2)}%"></div>
        </div>
        <div class="bar-nums">${i.overdue} overdue · ${i.pending} pending · ${pct}%</div>
      </div>`;
    }).join('')}
  </div>
  <div class="legend"><span class="lg-dot pending"></span>On track<span class="lg-dot age-stale"></span>Overdue</div>`;
}
// Plain-language takeaway built from the same numbers already on the
// page — busiest department, oldest backlog, 14-day trend direction, and
// two deeper checks (priority inversion, mean/median skew) that surface
// patterns the raw charts don't call out on their own — so a GM gets the
// headline without having to read every chart first.
function buildOrgInsight(byDept, ageBuckets, netChange14, byPriorityTime, avgMs, medianMs){
  const busiest = byDept.filter(d=>d.pending>0).sort((a,b)=>b.pending-a.pending)[0];
  const staleCount = (ageBuckets.find(b=>b.cls==='age-stale')||{count:0}).count;
  const parts = [];
  if(busiest) parts.push(`<b>${escHtml(busiest.label)}</b> carries the largest pending load (${busiest.pending} open).`);
  if(staleCount>0) parts.push(`${staleCount} ticket${staleCount===1?'':'s'} ${staleCount===1?'has':'have'} been open <b>7+ days</b>.`);
  if(netChange14>0) parts.push(`Backlog grew by <b>${netChange14}</b> over the last 14 days.`);
  else if(netChange14<0) parts.push(`Backlog shrank by <b>${Math.abs(netChange14)}</b> over the last 14 days.`);
  else parts.push(`Backlog held steady over the last 14 days.`);
  // Priority inversion check: Critical tickets should resolve faster than
  // Low ones. If they're actually slower, that's a real operational risk
  // worth calling out explicitly rather than leaving buried in a chart.
  const byPriMap = new Map(byPriorityTime.map(g=>[g.label, g.ms]));
  const criticalMs = byPriMap.get('Critical');
  const lowMs = byPriMap.get('Low');
  if(criticalMs!=null && lowMs!=null && criticalMs > lowMs){
    parts.push(`<b>Critical</b> tickets are taking longer to resolve than <b>Low</b>-priority ones on average — worth a look.`);
  }
  if(avgMs!=null && medianMs!=null && medianMs>0 && avgMs > medianMs*1.4){
    parts.push(`The average resolution time is being pulled up by a small number of slow tickets — the median is a more typical figure.`);
  }
  return parts.join(' ');
}

// ---------- Toast ----------
function toast(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className='toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

// ---------- "Ticket done" notification ----------
// Shown when a ticket the current user created gets marked Done
// (RESOLVED). Stays on screen (no auto-dismiss) until the user either
// clicks it — which jumps straight to that ticket's Flow Finder timeline —
// or dismisses it with the close (x) button.
const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>`;
function notifyTicketDone(ticketId){
  const wrap = document.getElementById('notifWrap');
  if(!wrap) return;
  const m = master(ticketId);
  const title = m && m.notes ? m.notes : ticketId;
  const el = document.createElement('div');
  el.className = 'notif-box';
  el.innerHTML = `
    <span class="notif-icon">${ICON_CHECK}</span>
    <span class="notif-body">
      <div class="notif-title">${escHtml(ticketId)} is now Done</div>
      <div class="notif-sub">${escHtml(title)} — click to view in Flow Finder</div>
    </span>
    <button type="button" class="notif-close" aria-label="Dismiss">✕</button>`;
  el.addEventListener('click', (e)=>{
    if(e.target.closest('.notif-close')){ el.remove(); return; }
    el.remove();
    openTicketInFlow(ticketId);
  });
  wrap.appendChild(el);
}

/* ═══════════ Respond modal — one modal, branches per action ═══════════ */
function openRespondModal(kind, tid){
  const actor = currentUser();
  const backdrop = document.createElement('div');
  backdrop.className='modal-backdrop';
  const titles = {
    accept:'Accept ticket', resume:'Resume',
    reminder:'Set reminder', attend:'Attend reminder', delegate:'Delegate ticket',
    resolve:'Done',
  };
  let extra = '';
  let needsComment = true;
  // Delegate target-type toggle — same Department/Person pattern as the
  // New Ticket drawer's "Route to" pills.
  let delegateTargetType = 'department';
  function delegateTargetFieldHtml(type){
    if(type==='department'){
      const deptOpts = activeDeptOptions();
      return `<select id="rm-target">${deptOpts.map(d=>`<option value="${escAttr(deptIdFor(d.name))}">${escHtml(d.name)}</option>`).join('')}</select>`;
    }
    const people = activePersonOptions().filter(p=>p.email!==actor.id);
    return `<select id="rm-target">${people.map(p=>`<option value="${escAttr(p.email)}">${escHtml(p.name)} — ${escHtml(p.email)}${p.deptName?` — ${escHtml(p.deptName)}`:''}</option>`).join('')}</select>`;
  }
  // Reminder due-date picker: quick presets + a clean split date/time
  // pair (native datetime-local renders inconsistently across browsers).
  function reminderDateTimeParts(ms){
    const d = dubaiParts(ms);
    return {
      date: `${d.year}-${pad(d.month+1)}-${pad(d.day)}`,
      time: `${pad(d.hour)}:${pad(d.minute)}`,
    };
  }
  function applyReminderPreset(preset){
    let ms;
    if(preset==='30m') ms = nowMs()+30*60000;
    else if(preset==='1h') ms = nowMs()+3600000;
    else { // '1d' — next day, 10:00 AM UAE time, not "24h from now"
      const p = dubaiParts(nowMs());
      ms = dubaiToMs(p.year, p.month, p.day+1, 10, 0);
    }
    const parts = reminderDateTimeParts(ms);
    const dateInput = backdrop.querySelector('#rm-date');
    const timeInput = backdrop.querySelector('#rm-time');
    if(dateInput) dateInput.value = parts.date;
    if(timeInput) timeInput.value = parts.time;
  }
  if(kind==='reminder'){
    const defaultDue = nowMs()+3600000; // 1 hour out, same as the "1 hour" preset
    const parts = reminderDateTimeParts(defaultDue);
    extra = `<div class="field">
      <label>Remind at (UAE time)</label>
      <div class="filter-pills" id="rmReminderPresets" style="margin-bottom:10px;">
        <button type="button" class="filter-btn" data-rm-preset="30m">30 min</button>
        <button type="button" class="filter-btn" data-rm-preset="1h">1 hour</button>
        <button type="button" class="filter-btn" data-rm-preset="1d">Tomorrow 10 AM</button>
      </div>
      <div class="dt-row">
        <input type="date" id="rm-date" value="${parts.date}">
        <input type="time" id="rm-time" value="${parts.time}">
      </div>
      <div class="dt-hint" id="rmReminderHint"></div>
    </div>`;
    needsComment = false;
  } else if(kind==='delegate'){
    extra = `<div class="field">
      <label>Route to</label>
      <div class="filter-pills route-toggle" id="rmTargetPills" role="radiogroup" aria-label="Route to" style="margin-bottom:10px;">
        <button type="button" class="filter-btn active" data-rm-target-type="department" role="radio" aria-checked="true" title="Department" aria-label="Department">${ICON_DEPARTMENT}</button>
        <button type="button" class="filter-btn" data-rm-target-type="person" role="radio" aria-checked="false" title="Person" aria-label="Person">${ICON_PERSON}</button>
      </div>
      <div id="rmTargetWrap">${delegateTargetFieldHtml(delegateTargetType)}</div>
    </div>`;
  } else if(kind==='accept' || kind==='resolve'){
    needsComment = false;
  }
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${titles[kind]}</h3>
      <p class="modal-sub">#${tid} · ${escHtml(ticketTitle(tid))}</p>
      ${extra}
      <div class="field"><label>Comment${needsComment?' (required)':' (optional)'}</label><textarea id="rm-comment" placeholder="What's the update?"></textarea></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="rm-cancel" title="Cancel">${ICON_CLOSE}<span class="btn-label">Cancel</span></button>
        <button class="btn btn-primary" id="rm-confirm" title="Confirm">${ICON_ACCEPT}<span class="btn-label">Confirm</span></button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
  if(kind==='reminder'){
    const dateInput = backdrop.querySelector('#rm-date');
    const timeInput = backdrop.querySelector('#rm-time');
    const hint = backdrop.querySelector('#rmReminderHint');
    const fmtHint = ()=>{
      if(!dateInput.value || !timeInput.value){ hint.textContent=''; return; }
      const [y,mo,da] = dateInput.value.split('-').map(Number);
      const [hh,mm] = timeInput.value.split(':').map(Number);
      if([y,mo,da,hh,mm].some(n=>isNaN(n))){ hint.textContent=''; return; }
      const ms = dubaiToMs(y, mo-1, da, hh, mm, 0);
      const d = dubaiParts(ms);
      const wd = WEEKDAY_ABBR[d.weekdayIdx];
      const mon = MONTH_ABBR[d.month];
      let h = d.hour, ampm = h>=12?'PM':'AM'; h = h%12 || 12;
      hint.textContent = `Reminder set for ${wd}, ${d.day}-${mon}-${d.year} at ${h}:${pad(d.minute)} ${ampm} (UAE time)`;
    };
    backdrop.querySelectorAll('[data-rm-preset]').forEach(b=>{
      b.onclick = ()=>{
        backdrop.querySelectorAll('[data-rm-preset]').forEach(x=>x.classList.toggle('active', x===b));
        applyReminderPreset(b.dataset.rmPreset);
        fmtHint();
      };
    });
    dateInput.oninput = ()=>{ backdrop.querySelectorAll('[data-rm-preset]').forEach(x=>x.classList.remove('active')); fmtHint(); };
    timeInput.oninput = ()=>{ backdrop.querySelectorAll('[data-rm-preset]').forEach(x=>x.classList.remove('active')); fmtHint(); };
    fmtHint();
  }
  if(kind==='delegate'){
    backdrop.querySelectorAll('[data-rm-target-type]').forEach(b=>{
      b.onclick = ()=>{
        delegateTargetType = b.dataset.rmTargetType;
        backdrop.querySelectorAll('[data-rm-target-type]').forEach(x=>{
          x.classList.toggle('active', x===b);
          x.setAttribute('aria-checked', x===b ? 'true' : 'false');
        });
        document.getElementById('rmTargetWrap').innerHTML = delegateTargetFieldHtml(delegateTargetType);
      };
    });
  }
  backdrop.querySelector('#rm-cancel').onclick=()=>backdrop.remove();
  backdrop.querySelector('#rm-confirm').onclick=async ()=>{
    const confirmBtn = backdrop.querySelector('#rm-confirm');
    const comment = backdrop.querySelector('#rm-comment').value.trim();
    if(needsComment && !comment){ toast('A comment is required before you can respond.'); return; }
    const actorId = state.currentUserId;
    confirmBtn.disabled = true; // block double-submit while the write is in flight
    try{
      if(kind==='accept'){
        await acceptTicket({ticketId:tid, actorId});
        toast('Ticket accepted.');
      } else if(kind==='resume'){
        await resumeTicket({ticketId:tid, actorId, note:comment});
        toast('Resumed.');
      } else if(kind==='reminder'){
        const dateVal = backdrop.querySelector('#rm-date').value;
        const timeVal = backdrop.querySelector('#rm-time').value;
        if(!dateVal || !timeVal){ toast('Pick a date and time first.'); confirmBtn.disabled=false; return; }
        const [y,mo,da] = dateVal.split('-').map(Number);
        const [hh,mm] = timeVal.split(':').map(Number);
        if([y,mo,da,hh,mm].some(n=>isNaN(n))){ toast('Pick a valid date and time.'); confirmBtn.disabled=false; return; }
        const dueAtMs = dubaiToMs(y, mo-1, da, hh, mm, 0);
        await setReminder({ticketId:tid, actorId, dueAtMs});
        toast('Reminder set.');
      } else if(kind==='attend'){
        await attendReminder({ticketId:tid, actorId, note:comment});
        toast('Reminder attended.');
      } else if(kind==='delegate'){
        const targetVal = backdrop.querySelector('#rm-target').value;
        if(delegateTargetType==='department'){
          await transferTicket({ticketId:tid, actorId, targetType:'department', target:dept(targetVal).name, reason:comment});
          toast(`Transferred to ${dept(targetVal).name} — waiting for someone to accept.`);
        } else {
          await transferTicket({ticketId:tid, actorId, targetType:'person', target:targetVal, reason:comment});
          toast(`Delegated to ${nameOf(targetVal)} — waiting for them to accept.`);
        }
      } else if(kind==='resolve'){
        await resolveTicket({ticketId:tid, actorId, comment});
        toast('Done.');
        // The creator gets the "now Done" corner box only if the ticLog/Ticket
        // cache's Notify column is YES for this ticket — same flag that drives
        // the bell dropdown. It'll also show up in the bell dropdown either way
        // once render() runs, but this box is the just-happened-live nudge.
        const m = master(tid);
        const justResolved = EVENTS.filter(e=>e.ticketId===tid && e.action==='RESOLVED').sort((a,b)=>b.eventId-a.eventId)[0];
        if(m && m.createdBy===actorId && notifyFlagFor(tid, justResolved)) notifyTicketDone(tid);
      }
      backdrop.remove();
      render();
    }catch(err){
      // Mutation already rolled its optimistic event back out of EVENTS —
      // just tell the person and let them retry from the still-open modal.
      toast(err && err.message ? err.message : 'Something went wrong — please try again.');
      confirmBtn.disabled = false;
    }
  };
}

/* ═══════════ Wiring ═══════════ */
function wireGlobal(){
  document.querySelectorAll('[data-ff]').forEach(b=>{
    b.onclick = ()=>{
      if(b.dataset.ff==='reset') demoOffsetMs = 0;
      else demoOffsetMs += parseInt(b.dataset.ff,10);
      render();
    };
  });
  document.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick=()=>{ state.view=b.dataset.view; state.ffSelectedTicket=null; render(); };
  });
  document.querySelectorAll('[data-mystatus]').forEach(b=>{
    b.onclick=()=>{ state.myStatusFilter=b.dataset.mystatus; render(); };
  });
  document.querySelectorAll('[data-deptstatus]').forEach(b=>{
    b.onclick=()=>{ state.deptStatusFilter=b.dataset.deptstatus; render(); };
  });
  document.querySelectorAll('[data-reportmode]').forEach(b=>{
    b.onclick=()=>{ state.reportMode=b.dataset.reportmode; render(); };
  });
  document.querySelectorAll('[data-reportgroup]').forEach(b=>{
    b.onclick=()=>{ state.reportGroup=b.dataset.reportgroup; render(); };
  });
  const repFrom = document.getElementById('repFrom');
  if(repFrom) repFrom.addEventListener('change', ()=>{ state.reportFrom=repFrom.value; render(); });
  const repTo = document.getElementById('repTo');
  if(repTo) repTo.addEventListener('change', ()=>{ state.reportTo=repTo.value; render(); });
  const repPerson = document.getElementById('repPerson');
  if(repPerson) repPerson.addEventListener('change', ()=>{ state.reportPerson=repPerson.value; render(); });
  const repDept = document.getElementById('repDept');
  if(repDept) repDept.addEventListener('change', ()=>{ state.reportDept=repDept.value; render(); });
  const repClear = document.getElementById('repClearFilters');
  if(repClear) repClear.onclick = ()=>{ state.reportFrom=''; state.reportTo=''; state.reportPerson='all'; state.reportDept='all'; render(); };
  window.__mselRefresh = render;
  wireFfCategorySelect();
  wireFfDateFilter();
  wireFfToolbarScrollGuard();
  ['ffHandlerMsel','ffDeptMsel'].forEach(id=>{
    if(document.getElementById(id)){
      wireMultiSelect(id, ()=>state.ffMulti, (v)=>{ state.ffMulti = v; }, render, {single:true});
    }
  });
  const ffq = document.getElementById('ffQuery');
  if(ffq){
    const ev = state.ffMode==='ticket' ? 'input' : 'change';
    ffq.addEventListener(ev, ()=>{ state.ffQuery = ffq.value; render(); });
  }
  const ffFrom = document.getElementById('ffFrom');
  if(ffFrom) ffFrom.addEventListener('change', ()=>{ state.ffFrom = ffFrom.value; render(); });
  const ffTo = document.getElementById('ffTo');
  if(ffTo) ffTo.addEventListener('change', ()=>{ state.ffTo = ffTo.value; render(); });
  const ffSubjInput = document.getElementById('ffSubjectInput');
  const ffSubjWrap = document.getElementById('ffSubjectDrop');
  // Subject dropdown escapes the toolbar's clipping the same way the
  // category/date panels do: position:fixed in CSS, real coordinates
  // (and a matching width, since it no longer stretches via left:0/right:0)
  // computed here from the input's own on-screen position.
  const positionFfSubjList = ()=>{
    const list = document.getElementById('ffSubjectList');
    if(!list || !ffSubjWrap) return;
    list.style.width = ffSubjWrap.offsetWidth + 'px';
    positionFfPanel(ffSubjWrap, list, 'left');
  };
  if(ffSubjInput){
    ffSubjInput.oninput = ()=>{ filterFfSubjDrop(ffSubjInput.value); positionFfSubjList(); };
    ffSubjInput.onfocus = ()=>{ openFfSubjDrop(); positionFfSubjList(); };
    ffSubjInput.onblur = ()=> setTimeout(closeFfSubjDrop, 160);
  }
  const ffSubjList = document.getElementById('ffSubjectList');
  if(ffSubjList){
    ffSubjList.addEventListener('mousedown', e=>{
      e.preventDefault();
      const row = e.target.closest('[data-ff-emp-id]');
      if(row) selectFfSubjDrop(row.dataset.ffEmpId);
    });
  }
  document.querySelectorAll('[data-open-ticket]').forEach(row=>{
    row.onclick=()=>{ openTicketInFlow(row.dataset.openTicket); };
  });
  const ffBack = document.getElementById('ffBack');
  if(ffBack) ffBack.onclick=()=>{
    state.ffSelectedTicket = null;
    if(state.ffReturnView){ state.view = state.ffReturnView; state.ffReturnView = null; }
    render();
  };
  document.querySelectorAll('[data-respond]').forEach(b=>{
    b.onclick=()=> openRespondModal(b.dataset.respond, b.dataset.tid);
  });
  const newTicketBtn = document.getElementById('newTicketBtn');
  if(newTicketBtn) newTicketBtn.onclick = openNewTicketDrawer;
  const notifBellBtn = document.getElementById('notifBellBtn');
  if(notifBellBtn) notifBellBtn.onclick = (e)=>{
    e.stopPropagation();
    state.notifOpen = !state.notifOpen;
    if(state.notifOpen) _armNotifAutoHide(); else _clearNotifAutoHide();
    render();
  };
  const notifDropdown = document.getElementById('notifDropdown');
  if(notifDropdown){
    notifDropdown.addEventListener('click', e=>{
      e.stopPropagation();
      const dismissKey = e.target.closest('[data-notif-dismiss]');
      if(dismissKey){ notifDismissed.add(dismissKey.dataset.notifDismiss); render(); return; }
      const openRow = e.target.closest('[data-notif-open]');
      if(openRow){ _clearNotifAutoHide(); state.notifOpen = false; openTicketInFlow(openRow.dataset.notifOpen); }
    });
    // Pause the countdown while the pointer is over the dropdown, resume
    // (fresh 5s) once it leaves — same courtesy as a toast that pauses on hover.
    notifDropdown.addEventListener('mouseenter', _clearNotifAutoHide);
    notifDropdown.addEventListener('mouseleave', ()=>{ if(state.notifOpen) _armNotifAutoHide(); });
  }
  const profileBtn = document.getElementById('profileBtn');
  if(profileBtn) profileBtn.onclick = (e)=>{ e.stopPropagation(); state.profileOpen = !state.profileOpen; render(); };
}
// Click anywhere outside the bell/dropdown or profile trigger/dropdown
// closes whichever is open — wired once, not re-bound on every render
// (unlike the handlers above, which live inside the innerHTML that gets
// replaced each render).
document.addEventListener('click', (e)=>{
  let changed = false;
  if(state.notifOpen && !e.target.closest('.bell-wrap')){ state.notifOpen = false; _clearNotifAutoHide(); changed = true; }
  if(state.profileOpen && !e.target.closest('.profile-wrap')){ state.profileOpen = false; changed = true; }
  if(changed) render();
});

/* ═══════════ New Ticket drawer ═══════════
   Captures the fixed E2 (Subject Employee) up front, and lets creation
   itself be a delegation: route straight to a Department queue OR
   directly to a named Person — both supported, matching TK-5001 (dept)
   and TK-5002 (direct-to-person) in the real sample data. */
let newTicketForm = {priority:'Medium', subjectType:'Employee', subjectEmployee:'', targetType:'department', target:'', title:'', description:'', notifyOnDone:true};
/* ═══════════ Employee search dropdown — same render method as docPortal's
   filterDrop: plain search box + highlighted name/id list, instead of the
   checkbox multi-select. Used only for the New Ticket "Subject Employee"
   field (ap2_employee cache). ═══════════ */
/* ═══════════ Employee search dropdown — same render method as docPortal's
   filterDrop: plain search box + highlighted name/id list, instead of the
   checkbox multi-select. Used only for the New Ticket "Subject Employee"
   field (ap2_employee cache).
   Like docPortal, the input/list DOM nodes are rendered once and then
   patched directly (list.innerHTML=...) rather than being torn down and
   rebuilt on every keystroke/click — a full-page re-render mid-mousedown
   was racing against the click and closing the dropdown before the
   selection registered. */
function empDropSelectedLabel(){
  const id = newTicketForm.subjectEmployee;
  if(!id) return '';
  const e = EMPLOYEES.find(x=>String(x.id)===String(id));
  return e ? employeeLabel(e) : id;
}
function empSearchDropShell(){
  return `
  <div class="emp-drop" id="ntSubjectDrop">
    <input type="text" class="emp-drop-input" id="ntSubjectInput" autocomplete="off"
      placeholder="${EMPLOYEES.length?'Search by ID or name…':'No employees in cache'}"
      value="${escAttr(empDropSelectedLabel())}">
    <div class="dropdown-list" id="ntSubjectList"></div>
  </div>`;
}
function filterEmpDrop(q){
  const list = document.getElementById('ntSubjectList');
  if(!list) return;
  const lq = q.toLowerCase().trim();
  const hits = (lq ? EMPLOYEES.filter(e=>String(e.id).toLowerCase().includes(lq)||e.name.toLowerCase().includes(lq)) : EMPLOYEES).slice(0,15);
  const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hl = v=>{
    const safe = escHtml(v);
    return lq ? safe.replace(new RegExp(`(${escRe(lq)})`,'gi'),'<em>$1</em>') : safe;
  };
  let html;
  if(!EMPLOYEES.length){
    html = `<div class="di no-match">No employees in cache</div>`;
  }else if(!hits.length){
    html = `<div class="di no-match">No employees found</div>`;
  }else{
    html = hits.map(e=>`<div class="di" data-emp-drop-id="${escAttr(e.id)}">
        <div class="dn">${hl(e.name)}</div>
        <div class="ds">ID: ${hl(String(e.id))}</div>
      </div>`).join('');
  }
  if(lq && !hits.some(e=>String(e.id).toLowerCase()===lq)){
    html += `<div class="di emp-drop-add" data-emp-drop-add="1"><i class="ti ti-plus"></i><span>Use "${escHtml(q.trim())}" as new employee code</span></div>`;
  }
  list.innerHTML = html;
  list.classList.add('open');
  const wrap = document.getElementById('ntSubjectDrop'); if(wrap) wrap.classList.add('open');
}
function openEmpDrop(){
  const input = document.getElementById('ntSubjectInput');
  filterEmpDrop(input ? input.value : '');
}
function closeEmpDrop(){
  const list = document.getElementById('ntSubjectList'); if(list) list.classList.remove('open');
  const wrap = document.getElementById('ntSubjectDrop'); if(wrap) wrap.classList.remove('open');
}
function selectEmpDrop(id){
  newTicketForm.subjectEmployee = String(id);
  const input = document.getElementById('ntSubjectInput');
  if(input) input.value = empDropSelectedLabel();
  closeEmpDrop();
}

/* ═══════════ Target (Department / Person) search dropdown — same
   single-search-box method as the Subject Employee field above, used for
   the New Ticket "Route to" picker. Replaces the old checkbox-panel-style
   multi-select (which needed an extra click to open, then typing into a
   second, nested search box — the pattern flagged as unprofessional).
   Options come from activeDeptOptions()/activePersonOptions() depending on
   newTicketForm.targetType. ═══════════ */
function targetDropOptions(){
  return newTicketForm.targetType==='department'
    ? activeDeptOptions().map(d=>({value:d.name, label:d.name, sub:''}))
    : activePersonOptions().map(p=>({value:p.email, label:p.name, sub:p.email}));
}
function targetDropSelectedLabel(){
  const val = newTicketForm.target;
  if(!val) return '';
  if(newTicketForm.targetType==='department') return val;
  const u = userFor(val);
  return u ? u.name : val;
}
function targetSearchDropShell(){
  const f = newTicketForm;
  const opts = targetDropOptions();
  const placeholder = opts.length
    ? (f.targetType==='department' ? 'Search departments…' : 'Search by name or email…')
    : (f.targetType==='department' ? 'No departments yet — type to add one' : 'No people available');
  return `
  <div class="emp-drop" id="ntTargetDrop">
    <input type="text" class="emp-drop-input" id="ntTargetInput" autocomplete="off"
      placeholder="${escAttr(placeholder)}"
      value="${escAttr(targetDropSelectedLabel())}">
    <div class="dropdown-list" id="ntTargetList"></div>
  </div>`;
}
function filterTargetDrop(q){
  const list = document.getElementById('ntTargetList');
  if(!list) return;
  const f = newTicketForm;
  const opts = targetDropOptions();
  const lq = q.toLowerCase().trim();
  const hits = (lq ? opts.filter(o=> o.label.toLowerCase().includes(lq) || (o.sub||'').toLowerCase().includes(lq)) : opts).slice(0,15);
  const escRe = s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  const hl = v=>{
    const safe = escHtml(v);
    return lq ? safe.replace(new RegExp(`(${escRe(lq)})`,'gi'),'<em>$1</em>') : safe;
  };
  let html;
  if(!opts.length && f.targetType!=='department'){
    html = `<div class="di no-match">No people available</div>`;
  }else if(!hits.length){
    html = `<div class="di no-match">No matches</div>`;
  }else{
    html = hits.map(o=>`<div class="di" data-target-drop-value="${escAttr(o.value)}">
        <div class="dn">${hl(o.label)}</div>
        ${o.sub?`<div class="ds">${hl(o.sub)}</div>`:''}
      </div>`).join('');
  }
  if(f.targetType==='department' && lq && !hits.some(o=>o.label.toLowerCase()===lq)){
    html += `<div class="di emp-drop-add" data-target-drop-add="1"><span>+ Use "${escHtml(q.trim())}" as new department name</span></div>`;
  }
  list.innerHTML = html;
  list.classList.add('open');
  const wrap = document.getElementById('ntTargetDrop'); if(wrap) wrap.classList.add('open');
}
function openTargetDrop(){
  const input = document.getElementById('ntTargetInput');
  filterTargetDrop(input ? input.value : '');
}
function closeTargetDrop(){
  const list = document.getElementById('ntTargetList'); if(list) list.classList.remove('open');
  const wrap = document.getElementById('ntTargetDrop'); if(wrap) wrap.classList.remove('open');
}
function selectTargetDrop(value){
  newTicketForm.target = String(value);
  const input = document.getElementById('ntTargetInput');
  if(input) input.value = targetDropSelectedLabel();
  closeTargetDrop();
}

function newTicketFormHtml(u){
  const f = newTicketForm;
  return `
    <div class="field">
      <label>Subject Employee (E2)
        <span class="cache-ping ${EMPLOYEE_CACHE_OK?'ok':'warn'}" title="${EMPLOYEE_CACHE_OK?'Employee roster loaded from ap2_employee cache':'ap2_employee cache unavailable — no employee roster loaded'}"></span>
      </label>
      ${empSearchDropShell()}
    </div>
    <div class="field">

      <label>Ticket name</label>
      <input type="text" id="nt-title" placeholder="e.g. SIM package renewal" value="${f.title.replace(/"/g,'&quot;')}">
    </div>
    <div class="field">
      <label>Description</label>
      <textarea id="nt-desc" placeholder="What's going on, and what do you need?">${f.description}</textarea>
    </div>
    <div class="form-grid">
      <div class="field">
        <label>Priority</label>
        <select id="nt-priority">
          ${['Critical','High','Medium','Low'].map(p=>`<option ${f.priority===p?'selected':''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Route to</label>
        <div class="filter-pills route-toggle" role="radiogroup" aria-label="Route to">
          <button type="button" class="filter-btn ${f.targetType==='department'?'active':''}" data-target-type="department" role="radio" aria-checked="${f.targetType==='department'}" title="Department" aria-label="Department">${ICON_DEPARTMENT}</button>
          <button type="button" class="filter-btn ${f.targetType==='person'?'active':''}" data-target-type="person" role="radio" aria-checked="${f.targetType==='person'}" title="Person" aria-label="Person">${ICON_PERSON}</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label>${f.targetType==='department' ? 'Department' : 'Delegate to'}</label>
      <div id="ntTargetWrap">${targetSearchDropShell()}</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="nt-submit" title="Create ticket">${ICON_PLUS}<span class="btn-label">Create ticket</span></button>
      <button class="btn btn-ghost" id="nt-reset" title="Clear">${ICON_ERASE}<span class="btn-label">Clear</span></button>
    </div>`;
}
function openNewTicketDrawer(){
  if(document.getElementById('ticketDrawer')) return;
  const u = currentUser();
  const drawer = document.createElement('aside');
  drawer.className = 'ticket-drawer';
  drawer.id = 'ticketDrawer';
  drawer.innerHTML = `
    <div class="drawer-head">
      <div>
        <h2>New Ticket</h2>
      </div>
      <button class="drawer-close" id="drawerClose" aria-label="Close" title="Close">${ICON_CLOSE}</button>
    </div>
    <div class="drawer-body" id="drawerBody">${newTicketFormHtml(u)}</div>`;
  document.body.appendChild(drawer);
  document.body.classList.add('drawer-open');
  requestAnimationFrame(()=>{ requestAnimationFrame(()=> drawer.classList.add('open')); });
  document.addEventListener('keydown', newTicketDrawerEscHandler);
  document.addEventListener('mousedown', newTicketDrawerOutsideClick);
  wireNewTicketDrawerFields(u);
  document.getElementById('drawerClose').onclick = closeNewTicketDrawer;
}
function newTicketDrawerEscHandler(e){ if(e.key==='Escape') closeNewTicketDrawer(); }
function newTicketDrawerOutsideClick(e){
  const drawer = document.getElementById('ticketDrawer');
  const fab = document.getElementById('newTicketBtn');
  if(!drawer) return;
  if(drawer.contains(e.target) || (fab && fab.contains(e.target))) return;
  closeNewTicketDrawer();
}
function closeNewTicketDrawer(){
  const drawer = document.getElementById('ticketDrawer');
  if(!drawer) return;
  drawer.classList.remove('open');
  document.body.classList.remove('drawer-open');
  document.removeEventListener('keydown', newTicketDrawerEscHandler);
  document.removeEventListener('mousedown', newTicketDrawerOutsideClick);
  setTimeout(()=>{ drawer.remove(); }, 220);
}
function refreshNewTicketDrawer(u){
  const body = document.getElementById('drawerBody');
  if(!body) return;
  body.innerHTML = newTicketFormHtml(u);
  wireNewTicketDrawerFields(u);
}
function wireNewTicketDrawerFields(u){
  const empInput = document.getElementById('ntSubjectInput');
  if(empInput){
    empInput.oninput = ()=> filterEmpDrop(empInput.value);
    empInput.onfocus = ()=> openEmpDrop();
    empInput.onblur = ()=> setTimeout(closeEmpDrop, 160);
  }
  const empList = document.getElementById('ntSubjectList');
  if(empList){
    empList.addEventListener('mousedown', e=>{
      e.preventDefault();
      const row = e.target.closest('[data-emp-drop-id]');
      if(row){ selectEmpDrop(row.dataset.empDropId); return; }
      const addRow = e.target.closest('[data-emp-drop-add]');
      if(addRow){ const empInput2 = document.getElementById('ntSubjectInput'); selectEmpDrop((empInput2?empInput2.value:'').trim()); }
    });
  }
  const t = document.getElementById('nt-title'); if(t) t.oninput = ()=>{ newTicketForm.title = t.value; };
  const d = document.getElementById('nt-desc'); if(d) d.oninput = ()=>{ newTicketForm.description = d.value; };
  const p = document.getElementById('nt-priority'); if(p) p.onchange = ()=>{ newTicketForm.priority = p.value; };
  document.querySelectorAll('[data-target-type]').forEach(b=>{
    b.onclick = ()=>{ newTicketForm.targetType = b.dataset.targetType; newTicketForm.target=''; refreshNewTicketDrawer(u); };
  });
  const targetInput = document.getElementById('ntTargetInput');
  if(targetInput){
    targetInput.oninput = ()=> filterTargetDrop(targetInput.value);
    targetInput.onfocus = ()=> openTargetDrop();
    targetInput.onblur = ()=> setTimeout(closeTargetDrop, 160);
  }
  const targetList = document.getElementById('ntTargetList');
  if(targetList){
    targetList.addEventListener('mousedown', e=>{
      e.preventDefault();
      const row = e.target.closest('[data-target-drop-value]');
      if(row){ selectTargetDrop(row.dataset.targetDropValue); return; }
      const addRow = e.target.closest('[data-target-drop-add]');
      if(addRow){ const targetInput2 = document.getElementById('ntTargetInput'); selectTargetDrop((targetInput2?targetInput2.value:'').trim()); }
    });
  }
  const submit = document.getElementById('nt-submit');
  if(submit) submit.onclick = async ()=>{
    const f = newTicketForm;
    let subjectEmployee = f.subjectEmployee;
    if(!subjectEmployee){ toast('Select (or enter) the Subject Employee (E2) — who this ticket is about.'); return; }
    if(!f.title.trim()){ toast('Give this a name first.'); return; }
    let target = f.target;
    if(f.targetType==='department' && target==='__new__'){ target = (f.targetNew||'').trim(); }
    if(!target){ toast(f.targetType==='department' ? 'Choose or name a department.' : 'Choose who to delegate this to.'); return; }
    submit.disabled = true; // block double-submit while the write is in flight
    try{
      const tid = await createTicket({
        creatorId: state.currentUserId, title:f.title, description:f.description||'(no description provided)',
        priority:f.priority, subjectType:'Employee', subjectEmployeeId:subjectEmployee,
        targetType:f.targetType, target, notifyOnDone:f.notifyOnDone,
      });
      toast(`Ticket ${tid} created for ${subjectEmployee}, routed to ${nameOf(target)}.`);
      newTicketForm = {priority:'Medium', subjectType:'Employee', subjectEmployee:'', targetType:'department', target:'', title:'', description:'', notifyOnDone:true};
      closeNewTicketDrawer();
      openTicketInFlow(tid);
    }catch(err){
      // createTicket already rolled its optimistic event back out of
      // EVENTS/TICKET_MASTER — just tell the person and let them retry
      // from the still-open drawer.
      toast(err && err.message ? err.message : 'Something went wrong — please try again.');
      submit.disabled = false;
    }
  };
  const reset = document.getElementById('nt-reset');
  if(reset) reset.onclick = ()=>{ newTicketForm = {priority:'Medium', subjectType:'Employee', subjectEmployee:'', targetType:'department', target:'', title:'', description:'', notifyOnDone:true}; refreshNewTicketDrawer(u); };
}

// periodic re-render so overdue flags stay live without user action
setInterval(()=>{
  if(state.view==='my' || state.view==='dept' || (state.view==='flow' && !state.ffSelectedTicket) || state.view==='org'){
    safeRender();
  }
}, 15000);
// Reminder/escalation/hourly-pending-alarm engine — runs independently of
// which screen is open (or whether a render was even due), so an alarm on
// a ticket the user isn't currently looking at still fires on time.
setInterval(tickReminderEngine, 30000);

// ---------- Boot ----------
loadStaffMeta();
loadOverlay();
applyOverlay();          // show this browser's own local tickets immediately, if any
trackMaxEventId(EVENTS); // seed the counter from any local rows saved in a previous session
ME = bootstrapIdentity();
discoverDirectory(EVENTS, TICKET_MASTER);
state.currentUserId = ME;
// Startup screen: Organization Reports if this session's role can see it,
// otherwise My Portal. isGM(ME) is already correct at this point even
// before the Users cache lands, thanks to the session-derived designation
// fallback in metaFor() above.
state.view = isGM(ME) ? 'org' : 'my';
render();
loadTickets();            // then read the real ap2_ticLog cache (IndexedDB) and merge it in — Users
                          // rows arrive with it, so re-resolve identity once real data is in.
loadEmployees();          // ap2_employee cache, for the New Ticket Subject Employee picker
async function _reboundIdentityAfterLoad(){
  ME = bootstrapIdentity();
  if(!state.currentUserId || state.currentUserId===ME) return;
  state.currentUserId = ME;
  discoverDirectory(EVENTS, TICKET_MASTER);
  safeRender();
}
setTimeout(_reboundIdentityAfterLoad, 400);
